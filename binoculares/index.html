<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binoculares de la Empatía</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e3d2;color:#403b36;font:17px system-ui}main{max-width:1050px;margin:auto;padding:18px}header{text-align:center}small{color:#526b53;letter-spacing:2px}h1,h2,h3{font-family:Georgia;color:#63516e}h1{font-size:42px;margin:8px}button{font:inherit;border:1px solid #9b8c75;border-radius:12px;background:#f9f3e5;color:#41382f;padding:12px;cursor:pointer}button:hover{background:#e2e9d8}button:focus-visible{outline:3px solid #79658c}button.primary{background:#637b5e;color:white}button:disabled{opacity:.5;cursor:default}.panel{background:#fcf6e9;border:2px solid #b8a88d;border-radius:20px;padding:20px;box-shadow:0 5px 15px #614b3422}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scene{text-align:center;background:#e7e4d5;padding:18px;border-radius:15px}.lenses{display:flex;justify-content:center;align-items:center;margin:15px auto;max-width:690px;background:#53574c;border-radius:80px;padding:12px;gap:8px}.lens{flex:1;min-width:0;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:50%;border:8px solid #b7a47f;background:radial-gradient(circle,#f6f2de,#c9d8ce);color:#394d42;font-family:Georgia;font-size:22px;padding:12px}.lens.selected{background:radial-gradient(circle,#fff9e7,#dbc9e5);border-color:#94779e}.lens svg{width:85px;max-width:65%}.bridge{width:14px;height:25px;background:#b7a47f}.note{background:#e6e1eb;border-radius:12px;padding:16px;min-height:80px;margin:10px 0}.answers{display:grid;gap:8px}.answers button{text-align:left}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.progress{font-size:14px;color:#665f54}footer{text-align:center;font-size:12px;margin:16px} @media(max-width:600px){.menu{grid-template-columns:1fr 1fr}.panel{padding:12px}h1{font-size:30px}.lens{font-size:17px;border-width:4px}.lens svg{width:48px}}</style><style>body{background:radial-gradient(ellipse at top,#e1edf4,#b6cbd9);color:#243e52}small{color:#365d78}h1,h2,h3{color:#234e70}header{padding:8px 0}header p{color:#42627a}.panel{background:#f5f9fc;border:2px solid #8caabd;box-shadow:0 8px 22px #24465e25}button{background:#e9f2f7;border-color:#8eacbf;color:#25475f}button:hover{background:#d4e6f1}button.primary{background:#245775;color:white}button:focus-visible{outline-color:#bd8547}.scene{background:#dceaf3;border:1px dashed #8caabd}.lenses{background:#263e50;box-shadow:0 6px 0 #172b39}.lens{background:radial-gradient(circle,#f6fbff,#add0e4);border-color:#7399b3;color:#20435d}.lens:hover{background:radial-gradient(circle,#fff,#bddce9)}.lens.selected{background:radial-gradient(circle,#fff6e4,#e6bd86);border-color:#c69655;color:#513b25}.bridge{background:#7399b3}.note{background:#f1e3cc;border-left:5px solid #bd8b4b;color:#493d30}.progress{color:#45667d}.answers button:disabled{opacity:.7}footer{color:#37586f}.menu button{border-top:4px solid #7399b3}.grid button{padding:24px 12px;background:#dcebf4}.grid button:nth-child(2){background:#f1e3cc;border-color:#c69655}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES</small><h1>Binoculares de la Empatía</h1><p>Una escena, dos miradas. Descubre lo que no se ve a simple vista.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const cases=[["El dibujo","Lucía ve que Pablo ha manchado su dibujo.","Lucía","Había dedicado mucho tiempo al dibujo. Piensa que Pablo no lo ha cuidado y siente tristeza.","Pablo","Tropezó al pasar. Le da vergüenza explicar lo ocurrido y teme que Lucía se enfade.","¿Qué información cambia nuestra interpretación?","Pablo tropezó sin querer.","Pablo quería estropearlo.","Lucía no tiene motivos para sentirse triste.","Podemos reconocer el daño aunque no haya sido intencionado."],["El recreo","Sara invita a jugar a Leo, pero él se marcha.","Sara","Tenía muchas ganas de jugar con Leo y se siente rechazada.","Leo","Le duele la cabeza y necesita estar en un sitio tranquilo. No sabe cómo decirlo.","¿Por qué podría haberse marchado Leo?","Necesita tranquilidad.","No quiere tener amigos.","Quiere castigar a Sara.","Necesitar espacio no significa rechazar a una persona."],["La fila","Hugo se coloca delante de Alba.","Alba","Llevaba esperando y piensa que Hugo se ha colado.","Hugo","La profesora le pidió recoger un material y volver a su lugar. Cree que está haciendo lo correcto.","¿Qué conviene averiguar?","Por qué Hugo ha vuelto a ese lugar.","Quién merece enfadarse más.","Si Hugo siempre se porta mal.","Preguntar nos ayuda a conocer el contexto."],["El balón","Nora no pasa el balón a Dani.","Dani","Quiere participar y siente que no cuentan con él.","Nora","Está nerviosa y mira solo al balón. No se ha dado cuenta de que Dani estaba libre.","¿Qué podemos comprender?","Dani puede sentirse excluido aunque Nora no lo pretendiera.","Dani debe dejar de jugar.","Nora siempre excluye a los demás.","La intención y el efecto de una acción pueden ser distintos."],["La torre","Una torre de bloques cae cuando Irene se acerca.","Irene","Quería añadir una pieza y se asusta al ver caer la torre.","Mateo","Había construido la torre con esfuerzo y cree que Irene no ha tenido cuidado.","¿Qué sabemos ahora?","Ambos tienen motivos para sentirse mal.","Solo Mateo puede sentirse mal.","Irene quería romper la torre.","Comprender dos emociones no obliga a elegir un culpable."],["El equipo","Alicia no elige a Marcos para su equipo.","Marcos","Siente que sus compañeros no valoran lo que puede aportar.","Alicia","Ha elegido rápidamente a sus amistades y no ha considerado cómo se sentirían los demás.","¿Qué nos enseña esta situación?","Una elección puede excluir aunque no se piense en ello.","Marcos debe acostumbrarse.","Alicia conoce los sentimientos de todos.","La empatía también implica pensar en el impacto de nuestras decisiones."],["La risa","Dos compañeros ríen cuando entra Álex.","Álex","Acaba de equivocarse en clase y teme que se estén burlando de él.","Julia","Está riéndose de una anécdota que le contó su amiga antes de que entrara Álex.","¿Qué diferencia hay entre hecho e interpretación?","La risa es un hecho; su motivo debe comprobarse.","La risa demuestra una burla.","Álex no debería sentir vergüenza.","Una interpretación comprensible no siempre coincide con lo ocurrido."],["El mensaje","Claudia escribe a Samuel y recibe un «vale».","Claudia","Interpreta la respuesta como enfado porque esperaba más palabras.","Samuel","Está ocupado cuidando a su hermano y responde deprisa.","¿Qué falta en un mensaje escrito?","El tono y parte del contexto.","La posibilidad de sentir emociones.","Siempre la sinceridad.","Un mensaje breve admite diferentes interpretaciones."],["El trabajo común","En una actividad grupal, Eva apenas interviene.","Eva","Tiene ideas, pero teme equivocarse delante de todos.","Adrián","Cree que Eva no quiere colaborar y se siente sobrecargado.","¿Qué ayudaría a entender a Eva?","Preguntarle y ofrecerle una forma cómoda de participar.","Etiquetarla como perezosa.","Obligarla a hablar inmediatamente.","La participación puede verse condicionada por la inseguridad."],["Una amistad","Marta ve a su mejor amiga con otro grupo.","Marta","Teme perder su amistad y siente celos.","Inés","Quiere conocer a otros compañeros sin dejar de ser amiga de Marta.","¿Qué pueden coexistir?","El miedo de Marta y el deseo de Inés de ampliar amistades.","La amistad y la obligación de estar siempre juntas.","Los celos y el derecho a controlar a otra persona.","Comprender una emoción no significa justificar el control."],["La exposición","Bruno corrige un dato de Ana delante de la clase.","Ana","Se siente avergonzada y piensa que Bruno quiere dejarla mal.","Bruno","Le preocupa que el grupo dé una información incorrecta. No piensa en cómo hacer la corrección.","¿Qué debemos distinguir?","La intención de corregir y el impacto de hacerlo en público.","Que una buena intención evita todo daño.","Que corregir siempre es humillar.","Podemos cuidar tanto el contenido como la forma."],["La broma","Un grupo repite un apodo que molesta a Omar.","Omar","Ha pedido que dejen de llamarle así y se siente humillado.","Diego","Dice que solo es una broma, aunque sabe que Omar ha pedido que pare.","¿Qué implica aquí la empatía?","Respetar el límite de Omar y detener la conducta.","Aceptar la broma porque Diego se divierte.","Pedir a Omar que ignore siempre el apodo.","Comprender perspectivas no justifica el daño. Si continúa, hay que pedir apoyo adulto."]];const app=document.querySelector('#app');let group=0,idx=0,seen=[false,false],active=-1,done=false;function home(){app.innerHTML='<div class="panel"><h2>Elige tu nivel de investigación</h2><div class="grid"><button onclick="menu(0)"><h3>Detectives Exploradores</h3>3.º y 4.º de Primaria</button><button onclick="menu(1)"><h3>Detectives Expertos</h3>5.º y 6.º de Primaria</button></div></div>'}function menu(g){group=g;app.innerHTML='<div class="panel"><button onclick="home()">← Cambiar nivel</button><h2>Selecciona un caso</h2><div class="menu">'+cases.slice(g*6,g*6+6).map((c,i)=>'<button onclick="start('+ (g*6+i)+')">Caso '+(i+1)+'<h3>'+c[0]+'</h3></button>').join('')+'</div></div>'}function start(n){idx=n;seen=[false,false];active=-1;done=false;render()}function face(j){return '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M12 99Q12 70 50 70Q88 70 88 99" fill="'+(j?'#9c89b0':'#829b8a')+'"/><circle cx="50" cy="43" r="30" fill="#e5bd98"/><path d="M19 40Q13 5 50 8Q85 9 81 40Q66 22 44 29Q30 30 19 40" fill="'+(j?'#9a643e':'#644a38')+'"/><circle cx="39" cy="45" r="3" fill="#483c34"/><circle cx="61" cy="45" r="3" fill="#483c34"/><path d="M42 60Q50 56 58 60" stroke="#845947" stroke-width="2" fill="none"/></svg>'}function render(){let c=cases[idx];app.innerHTML='<div class="panel"><button onclick="menu(group)">← Casos</button><span class="progress"> Caso '+(idx%6+1)+' de 6</span><h2>'+c[0]+'</h2><div class="scene"><strong>Lo que observamos</strong><p>'+c[1]+'</p></div><div class="lenses">'+[0,1].map(j=>'<button class="lens '+(active===j?'selected':'')+'" aria-pressed="'+(active===j)+'" onclick="look('+j+')">'+face(j)+c[2+j*2]+'<small style="letter-spacing:0;font:13px system-ui">'+(seen[j]?'✓ Perspectiva explorada':'Pulsa para mirar')+'</small></button>').join('<span class="bridge"></span>')+'</div><div class="note" aria-live="polite">'+(active<0?'Mira por uno de los binoculares para descubrir una perspectiva.':'<strong>La perspectiva de '+c[2+active*2]+'</strong><p>'+c[3+active*2]+'</p>')+'</div><div id="challenge"></div></div>';if(seen.every(Boolean)){let order=[0,1,2].sort((a,b)=>((a+idx)%3)-((b+idx)%3));document.querySelector('#challenge').innerHTML='<h3>'+c[6]+'</h3><div class="answers">'+order.map(j=>'<button onclick="answer('+j+')">'+c[7+j]+'</button>').join('')+'</div><p id="feedback" role="status"></p><div class="nav" id="nav"></div>'}}function look(j){if(done)return;seen[j]=true;active=j;render()}function answer(j){if(done)return;let f=document.querySelector('#feedback');if(j!==0){f.textContent='Revisa las dos perspectivas. ¿Qué información nueva has descubierto? Puedes intentarlo otra vez.';return}done=true;f.innerHTML='<strong>¡Perspectivas conectadas!</strong> '+cases[idx][10];document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);document.querySelector('#nav').innerHTML='<button onclick="menu(group)">Elegir otro caso</button>'+(idx%6<5?'<button class="primary" onclick="start(idx+1)">Siguiente caso →</button>':'<button class="primary" onclick="home()">Volver al inicio</button>')}home();</script></body></html>
