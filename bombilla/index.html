<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bombilla de Soluciones</title><style>*{box-sizing:border-box}body{margin:0;background:#e7dfcb;color:#403829;font:18px system-ui}main{max-width:1100px;margin:auto;padding:24px}header,section{background:#fff8e8;border:2px solid #b69b6a;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 4px 15px #483d2620}header{text-align:center;background:#46573c;color:#fff5db}h1{font: bold 38px Georgia;margin:8px}h2{font: bold 27px Georgia;color:#46573c}button,textarea{font:inherit}button{border:2px solid #a79370;border-radius:12px;background:#765573;color:white;padding:12px 18px;cursor:pointer;margin:5px}button.choice{background:#f9f1df;color:#403829;text-align:left;display:block;width:100%;margin:8px 0}button.sel{background:#dce6cb;border-color:#52683f}button:focus-visible{outline:3px solid #765573}textarea{width:100%;padding:12px;border:1px solid #a79370;border-radius:10px;background:#fffdf6}#bulb{text-align:center;font-size:70px;filter:grayscale(1);transition:filter .3s}#bulb.on{filter:none;text-shadow:0 0 28px #e8b840}.note{background:#e9e2ef;padding:12px;border-radius:12px}footer{text-align:center;font-size:13px}button:disabled{opacity:.5}</style><main><header>ACADEMIA DE DETECTIVES SOCIALES<h1>La Bombilla de Soluciones</h1>Investiga · Genera ideas · Valora</header><section id="v"></section><footer>© 2026 María Jesús Relaño · Somos Detectives Sociales · No se guardan datos personales.</footer></main><script>const banks=[[["El balón","Dos grupos quieren el mismo balón.","Repartir turnos","Proponer un juego común","Pedir ayuda para acordar turnos","Quitar el balón","Insultar al otro grupo"],["El lápiz","Alguien toma tu lápiz sin permiso.","Pedir que lo devuelva","Explicar cómo te sientes","Acordar cómo prestar material","Romper su lápiz","Gritarle"],["La fila","Alguien se pone delante de ti.","Recordar el turno con calma","Preguntar qué ha pasado","Pedir ayuda si continúa","Empujar","Amenazar"],["El dibujo","Un compañero estropea tu dibujo sin querer.","Escuchar su explicación","Pedir ayuda para repararlo","Expresar tu disgusto con respeto","Estropear el suyo","Ridiculizarlo"],["El juego","Tus amigos quieren otro juego.","Proponer alternar juegos","Buscar un juego que guste a todos","Aceptar jugar otra cosa o elegir otra actividad","Obligarlos","Dejar de hablarles para castigarlos"],["La derrota","Pierdes una partida y te enfadas.","Tomar un descanso","Felicitar al ganador","Pedir otra partida cuando estés tranquilo","Tirar las fichas","Acusar sin pruebas"],["Las reglas","Cambian las reglas a mitad del juego.","Recordar las reglas acordadas","Acordar nuevas reglas entre todos","Pedir mediación","Hacer trampas","Amenazar"],["El asiento","Dos personas quieren el mismo asiento.","Alternar días","Buscar otro asiento","Preguntar qué necesita cada persona","Empujar","Burlarse"],["El puzzle","Dos compañeros quieren colocar la misma pieza.","Turnarse","Repartir tareas","Buscar juntos dónde colocarla","Esconder piezas","Romper el puzzle"],["La pintura","No hay suficientes rotuladores.","Compartir por turnos","Usar otros colores","Pedir más material","Acapararlos","Quitar los de otros"]],[["Mi opinión","En el equipo nadie escucha tus propuestas.","Pedir un turno de palabra","Proponer escuchar todas las ideas","Solicitar mediación","Sabotear el trabajo","Insultar"],["El rumor","Te cuentan que alguien habla mal de ti.","No difundirlo","Preguntar con calma si es seguro","Pedir apoyo adulto si te preocupa","Difundir otro rumor","Vengarte"],["La amistad","Tu mejor amigo juega con otra persona.","Expresar cómo te sientes sin exigir","Proponer jugar juntos","Buscar otra actividad respetando su elección","Prohibirle otras amistades","Amenazar con dejarle"],["El mensaje","Un mensaje te parece ofensivo y no sabes su intención.","Esperar antes de responder","Preguntar qué quiso decir","Buscar ayuda adulta si hay amenazas","Publicarlo para humillar","Responder con insultos"],["El reparto","Sientes que haces más trabajo que el resto.","Revisar juntos las tareas","Expresar lo que necesitas","Pedir ayuda al docente","Borrar el trabajo","Acusar públicamente"],["La presión","Tus amigos te animan a romper una norma.","Decir que no con firmeza","Proponer otra actividad","Alejarte y buscar apoyo","Hacerlo para encajar","Presionar a otro"],["La crítica","Critican tu trabajo delante de la clase.","Pedir comentarios concretos","Explicar cómo prefieres recibir críticas","Tomarte tiempo antes de responder","Humillar a quien critica","Romper el trabajo"],["El malentendido","Un grupo se ríe y crees que es de ti.","Distinguir hechos de suposiciones","Preguntar si es seguro","Buscar apoyo si ocurre repetidamente","Acusar sin comprobar","Insultar"],["La decisión","El grupo no se pone de acuerdo sobre un proyecto.","Comparar propuestas","Combinar ideas","Votar tras escuchar a todos","Imponer tu idea","Excluir a quien discrepa"],["La exclusión","Alguien queda fuera de una actividad.","Invitarle a participar","Revisar cómo se organizan los grupos","Avisar a un adulto si la exclusión se repite","Reírse","Ignorar deliberadamente"]]];let cycle=0,n=0,stage=0,sel=[],order=[],done=new Set(),idea='';const v=document.getElementById('v');function home(){v.innerHTML='<h2>Enciende la Academia</h2><p>Encuentra distintas soluciones respetuosas para encender cada bombilla.</p><button onclick="start(0)">Detectives exploradores · 3º y 4º</button><button onclick="start(1)">Detectives expertos · 5º y 6º</button>'}function start(c){cycle=c;done=new Set();menu()}function menu(){v.innerHTML='<h2>Elige un caso</h2><p>Bombillas encendidas: '+done.size+'/10 · '+(done.size===10?'Detective experto':done.size>=5?'Detective investigador':'Detective aprendiz')+'</p>'+banks[cycle].map((a,i)=>'<button onclick="openCase('+i+')">'+(done.has(i)?'💡 ':'')+(i+1)+'. '+a[0]+'</button>').join('')+'<p><button onclick="home()">Cambiar ciclo</button></p>'}function openCase(i){n=i;stage=0;sel=[];idea='';order=[0,1,2,3,4];for(let j=4;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}render()}function render(){let a=banks[cycle][n];v.innerHTML='<button onclick="menu()">← Casos</button><div id="bulb" class="'+(stage===3?'on':'')+'">💡</div><h2>'+a[0]+'</h2><p class="note">'+a[1]+'</p>';if(stage===0)v.innerHTML+='<h3>1. Investiga</h3><p>¿Cuál es el problema? ¿Qué necesitan las personas implicadas? Explícalo en voz alta.</p><button onclick="stage=1;render()">Buscar ideas →</button>';if(stage===1)v.innerHTML+='<h3>2. Genera ideas</h3><p>Selecciona tres alternativas respetuosas.</p>'+order.map(i=>'<button class="choice '+(sel.includes(i)?'sel':'')+'" aria-pressed="'+sel.includes(i)+'" onclick="toggle('+i+')">'+a[2+i]+'</button>').join('')+'<button onclick="check()">Comprobar</button><p id="feedback" role="status"></p>';if(stage===2)v.innerHTML+='<h3>3. Valora</h3><p>Estas alternativas pueden ayudar:</p>'+a.slice(2,5).map(x=>'<p>✓ '+x+'</p>').join('')+'<p>Las otras opciones pueden causar daño o aumentar el conflicto. ¿Qué consecuencias tendría cada alternativa? ¿Cuál elegirías y por qué?</p><label>Reto creativo: inventa otra solución (opcional).</label><textarea rows="3" oninput="idea=this.value"></textarea><button onclick="finish()">Encender bombilla</button>';if(stage===3)v.innerHTML+='<h3>¡Bombilla encendida!</h3><p>Has encontrado alternativas y reflexionado sobre sus consecuencias.</p><button onclick="menu()">Elegir otro caso</button>'}function toggle(i){if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<3)sel.push(i);render()}function check(){if(sel.length===3&&sel.every(i=>i<3)){stage=2;render()}else document.getElementById('feedback').textContent='Revisa tus ideas: ¿respetan a las personas y evitan hacer daño? Puedes volver a intentarlo.'}function finish(){done.add(n);stage=3;render()}home()</script></html>
