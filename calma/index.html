<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Maletín de la Calma</title><style>*{box-sizing:border-box}body{margin:0;color:#423b37;background:radial-gradient(ellipse at top,#f8f1df,#d5c8b3);font:18px system-ui}main{max-width:1050px;margin:auto;padding:20px}header{text-align:center}small{letter-spacing:2px;color:#57694f;font-weight:700}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(30px,5vw,48px);margin:8px;color:#65516d}h2{margin:10px 0}.handle{width:160px;height:30px;border:10px solid #8d765b;border-bottom:0;border-radius:24px 24px 0 0;margin:auto}.case{padding:22px;background:#a98c6c;border:7px double #705a43;border-radius:25px;box-shadow:0 9px 0 #80684e,0 15px 24px #56422b44}.lining{background:#e9dfca;border:2px dashed #aa9576;border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tool{background:#faf4e6;border:1px solid #b9a48a;border-radius:15px;cursor:pointer;color:#443a36;font:inherit;padding:6px 10px 12px;box-shadow:0 3px 0 #b9a48a;transition:transform .2s}.tool:hover{transform:translateY(-3px)}.tool svg{width:130px;max-width:100%;display:block;margin:auto}.tool strong{display:block;font-family:Georgia;font-size:21px;color:#61516b}.tool span{font-size:14px}.panel{background:#faf4e6;border:2px solid #b4a184;border-radius:24px;padding:20px;text-align:center}.stage{height:230px;display:grid;place-items:center;background:radial-gradient(circle,#e8e6d5,#f9f2e6 70%);border-radius:18px;overflow:hidden}.stage svg{width:185px;height:185px}.stage.active svg{animation:breathe 3s ease-in-out infinite alternate}.stage.in svg{animation:grow 3s ease-in-out forwards}.stage.out svg{animation:shrink 5s ease-in-out forwards}.stage.bubble.active svg{animation:float 4s ease-in-out infinite}.stage.lemon.active svg{animation:squeeze 1s ease-in-out infinite alternate}@keyframes breathe{to{transform:scale(1.13)}}@keyframes grow{from{transform:scale(.8)}to{transform:scale(1.2)}}@keyframes shrink{from{transform:scale(1.2)}to{transform:scale(.8)}}@keyframes float{50%{transform:translateY(-20px)}}@keyframes squeeze{to{transform:scaleX(.86)}}button{font:inherit;color:#fff;background:#697c5e;border:0;border-radius:11px;padding:11px 18px;cursor:pointer;margin:4px}button.secondary{background:#796985}button:focus-visible{outline:3px solid #b07d44;outline-offset:3px}button:disabled{opacity:.5}.bar{height:9px;background:#ddd1ba;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#9caf8c;transition:width .3s}#count{font:bold 34px Georgia;color:#61516b}footer{text-align:center;font-size:12px;margin:22px} .choices{display:flex;justify-content:center;flex-wrap:wrap} @media(max-width:650px){.lining{grid-template-columns:repeat(2,1fr);padding:8px;gap:8px}.case{padding:9px}.tool strong{font-size:17px}.tool svg{width:95px}.stage{height:180px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · LABORATORIO DE EMOCIONES</small><h1>El Maletín de la Calma</h1><p>Elige una herramienta y practica a tu ritmo.</p></header><div id="view"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["La flor y la vela","Respiración tranquila","flower",[["Huele la flor","Inspira suavemente, sin forzar.",3],["Sopla la vela","Suelta el aire despacio.",5]],5],["La técnica de la tortuga","Detente antes de actuar","turtle",[["Me detengo","Deja de hacer lo que estabas haciendo.",5],["Me recojo","Abraza suavemente tus brazos si te resulta cómodo.",7],["Respiro","Respira a tu ritmo y relaja los hombros.",15],["Salgo de mi caparazón","Piensa qué necesitas antes de actuar.",10]],1],["Los cinco sentidos","Conecta con el presente","sense",[["5 cosas que ves","Mira alrededor y encuentra cinco cosas.",20],["4 cosas que notas","Observa cuatro sensaciones del tacto.",20],["3 sonidos","Escucha tres sonidos.",20],["2 olores","Busca dos olores o imagínalos.",20],["1 sabor","Nota un sabor o recuerda uno agradable.",15]],1],["Exprime el limón","Relaja tus manos","lemon",[["Exprime el limón","Aprieta suavemente las manos, sin hacerte daño.",4],["Suelta el limón","Abre las manos y nota cómo se relajan.",7]],4],["Burbujas de pensamientos","Observa tus pensamientos","bubble",[["Una burbuja","Imagina que colocas un pensamiento en una burbuja.",10],["Déjala flotar","Observa cómo se mueve. No necesitas eliminar el pensamiento.",15],["Vuelve al presente","Nota tus pies y tu respiración.",10]],2],["La brújula de las palabras","Háblate con amabilidad","compass",[["Puedo tomarme un momento","Repite esta frase para ti.",8],["Puedo pedir ayuda","Piensa en una persona de confianza.",8],["Puedo ir paso a paso","Elige un pequeño paso que puedas dar.",8]],1]],art={"flower":"<path d=\"M62 83V145M62 125Q35 100 32 120Q44 140 62 125M62 112Q85 89 92 111Q83 126 62 112\" stroke=\"#617b58\" stroke-width=\"5\" fill=\"#9caf85\"/><g fill=\"#c5a7c9\" stroke=\"#92769c\" stroke-width=\"2\"><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(0 62 68)\"/><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(60 62 68)\"/><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(120 62 68)\"/><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(180 62 68)\"/><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(240 62 68)\"/><ellipse cx=\"62\" cy=\"42\" rx=\"15\" ry=\"26\" transform=\"rotate(300 62 68)\"/></g><circle cx=\"62\" cy=\"68\" r=\"14\" fill=\"#dfc17b\"/><rect x=\"106\" y=\"88\" width=\"32\" height=\"58\" rx=\"6\" fill=\"#e6d6b0\" stroke=\"#b79d70\" stroke-width=\"2\"/><path d=\"M122 89Q104 70 123 49Q139 76 122 89\" fill=\"#d9a45f\"/><path d=\"M122 86L122 69\" stroke=\"#fff0b3\" stroke-width=\"5\"/>","turtle":"<ellipse cx=\"78\" cy=\"90\" rx=\"49\" ry=\"35\" fill=\"#8da17b\" stroke=\"#4e6548\" stroke-width=\"3\"/><ellipse cx=\"135\" cy=\"96\" rx=\"19\" ry=\"16\" fill=\"#b4c49b\"/><circle cx=\"142\" cy=\"92\" r=\"3\" fill=\"#374b36\"/><path d=\"M43 115L34 132M106 115L119 132\" stroke=\"#7e986e\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M30 90L78 62L124 90L78 120Z M78 62V120M30 90H124\" fill=\"none\" stroke=\"#66815d\" stroke-width=\"3\"/>","sense":"<circle cx=\"70\" cy=\"64\" r=\"38\" fill=\"#c1d9d6\" stroke=\"#a78a57\" stroke-width=\"9\"/><path d=\"M97 93L137 137\" stroke=\"#947147\" stroke-width=\"17\" stroke-linecap=\"round\"/><path d=\"M44 64Q70 39 96 64Q70 89 44 64\" fill=\"#fff9e8\" stroke=\"#607d79\" stroke-width=\"3\"/><circle cx=\"70\" cy=\"64\" r=\"12\" fill=\"#739a9b\"/><circle cx=\"70\" cy=\"64\" r=\"5\" fill=\"#344c4e\"/>","lemon":"<ellipse cx=\"80\" cy=\"92\" rx=\"37\" ry=\"55\" transform=\"rotate(40 80 92)\" fill=\"#e4c66f\" stroke=\"#b99a4a\" stroke-width=\"3\"/><path d=\"M115 48Q133 20 153 40Q140 63 115 48\" fill=\"#879e75\"/><path d=\"M58 67Q44 83 49 102\" fill=\"none\" stroke=\"#fff2bc\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M33 130Q52 108 67 124M101 131Q124 107 144 121\" fill=\"none\" stroke=\"#c19b79\" stroke-width=\"13\" stroke-linecap=\"round\"/>","bubble":"<circle cx=\"50\" cy=\"100\" r=\"33\" fill=\"#c6d9df\" fill-opacity=\".55\" stroke=\"#9a83b3\" stroke-width=\"2\"/><path d=\"M30.2 95.05q0 -16.5 16.5 -16.5\" fill=\"none\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"111\" cy=\"57\" r=\"29\" fill=\"#c6d9df\" fill-opacity=\".55\" stroke=\"#9a83b3\" stroke-width=\"2\"/><path d=\"M93.6 52.65q0 -14.5 14.5 -14.5\" fill=\"none\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"119\" cy=\"124\" r=\"20\" fill=\"#c6d9df\" fill-opacity=\".55\" stroke=\"#9a83b3\" stroke-width=\"2\"/><path d=\"M107 121q0 -10 10 -10\" fill=\"none\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"37\" cy=\"35\" r=\"15\" fill=\"#c6d9df\" fill-opacity=\".55\" stroke=\"#9a83b3\" stroke-width=\"2\"/><path d=\"M28 32.75q0 -7.5 7.5 -7.5\" fill=\"none\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/>","compass":"<circle cx=\"80\" cy=\"80\" r=\"62\" fill=\"#bc9a63\" stroke=\"#8d7148\" stroke-width=\"3\"/><circle cx=\"80\" cy=\"80\" r=\"51\" fill=\"#fff7e1\" stroke=\"#ad9369\" stroke-width=\"2\"/><path d=\"M80 30L95 80L80 130L65 80Z\" fill=\"#91749d\"/><path d=\"M30 80L80 65L130 80L80 95Z\" fill=\"#95aaa1\"/><circle cx=\"80\" cy=\"80\" r=\"6\" fill=\"#c29d65\"/><text x=\"80\" y=\"25\" text-anchor=\"middle\" font-size=\"12\" fill=\"#514533\">N</text>"};const view=document.querySelector('#view');let timer=null,i=0,step=0,left=0,running=false;function svg(k){return '<svg viewBox="0 0 160 160" aria-hidden="true">'+art[k]+'</svg>'}function stop(){clearInterval(timer);timer=null;running=false}function home(){stop();view.innerHTML='<div class="handle"></div><div class="case"><div class="lining">'+data.map((x,j)=>'<button class="tool" onclick="openTool('+j+')">'+svg(x[2])+'<strong>'+x[0]+'</strong><span>'+x[1]+'</span></button>').join('')+'</div></div><p style="text-align:center">No tienes que sentirte de una manera concreta. Puedes parar cuando quieras.</p>'}function openTool(j){stop();i=j;step=0;left=data[i][3][0][2];view.innerHTML='<div class="panel"><button class="secondary" onclick="home()">← Volver al maletín</button><h2>'+data[i][0]+'</h2><p>'+data[i][1]+'</p><div id="stage" class="stage">'+svg(data[i][2])+'</div><h3 id="instruction">¿Empezamos?</h3><p id="detail">Busca una postura cómoda. Si algo te molesta, puedes parar.</p><div id="count">—</div><div class="bar"><div id="progress" style="width:0%"></div></div><p id="phase"></p><button id="play" onclick="toggle()">Comenzar</button><button class="secondary" onclick="openTool(i)">Reiniciar</button><button class="secondary" onclick="next()">Siguiente paso</button></div>'}function total(){return data[i][3].length*data[i][4]}function current(){return data[i][3][step%data[i][3].length]}function show(){let a=current();document.querySelector('#instruction').textContent=a[0];document.querySelector('#detail').textContent=a[1];document.querySelector('#count').textContent=left+' s';document.querySelector('#phase').textContent='Paso '+(step+1)+' de '+total();document.querySelector('#progress').style.width=((step+(a[2]-left)/a[2])/total()*100)+'%';document.querySelector('#play').textContent=running?'Pausar':'Continuar';let s=document.querySelector('#stage');s.className='stage '+data[i][2]+(running?' active':'')+(running&&i===0?(step%2?' out':' in'):'');s.firstElementChild.style.animationPlayState=running?'running':'paused'}function toggle(){if(running){stop();show();return}running=true;show();timer=setInterval(()=>{left--;if(left<=0){next()}else show()},1000)}function next(){step++;if(step>=total()){finish();return}left=current()[2];show()}function finish(){stop();view.innerHTML='<div class="panel">'+svg(data[i][2]).replace('<svg ','<svg style="width:140px" ')+'<h2>¿Cómo te sientes ahora?</h2><p>No hay una respuesta correcta.</p><div class="choices">'+['Más tranquilo/a','Igual que antes','Necesito otra cosa'].map((x,j)=>'<button onclick="feedback('+j+')">'+x+'</button>').join('')+'</div><p id="feedback" role="status"></p><button class="secondary" onclick="openTool(i)">Repetir estrategia</button><button onclick="home()">Elegir otra herramienta</button></div>'}function feedback(j){document.querySelector('#feedback').textContent=['Puedes recordar esta herramienta para otra ocasión.','Está bien. No todas las herramientas ayudan siempre.','Puedes probar otra estrategia o pedir apoyo a una persona de confianza.'][j]}home();</script></body></html>
