<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base de Entrenamiento Cooperativo</title><style>*{box-sizing:border-box}body{margin:0;background:#e9dfd4;color:#493b35;font:18px system-ui}main{max-width:1100px;margin:auto;padding:20px}header{text-align:center}h1,h2{font-family:Georgia;color:#854e45}h1{margin:10px;font-size:40px}small{color:#855e50;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile,.panel{background:#fff8eb;border:2px solid #bca18a;border-radius:20px;padding:20px;box-shadow:0 5px 0 #bca18a}.tile{cursor:pointer;text-align:center;font:inherit;color:inherit}.tile:nth-child(3n+1){background:#efdad5}.tile:nth-child(3n+2){background:#f0e2b8}.tile:nth-child(3n){background:#dce9e3}.tile b{display:block;font: bold 24px Georgia}.emoji{font-size:60px}.panel{text-align:center}button{font:inherit;cursor:pointer;padding:12px 18px;border-radius:12px;border:1px solid #a98a76;background:#fff5e7;color:#513a31;margin:4px}button.primary{background:#864e45;color:white}button:focus-visible{outline:3px solid #335f66}#clock{font:bold 65px Georgia;color:#854e45;font-variant-numeric:tabular-nums}.bar{height:12px;background:#e5d6c6;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#aa7060}.task{background:#f2e4c6;padding:15px;border-radius:12px}footer{text-align:center;font-size:12px;margin:22px}.check{text-align:left;max-width:600px;margin:auto;display:grid;gap:12px} @media(max-width:650px){.grid{grid-template-columns:1fr 1fr}h1{font-size:30px}.tile{padding:10px}.tile b{font-size:19px}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES</small><h1>Base de Entrenamiento Cooperativo</h1><p>Sumamos ideas, compartimos responsabilidades y trabajamos en equipo.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["Folio giratorio","📝","Un folio y un lápiz por equipo","Inventad propuestas para mejorar el recreo.",[["Piensa una idea",30],["Escribe o dibuja tu aportación y pasa el folio",40],["Continúa hasta que todos hayan participado",120],["Leed las aportaciones y elegid una propuesta",60]]],["Lápices al centro","✏️","Papel y lápiz por persona","¿Cómo podemos incluir a alguien que está solo?",[["Dejad los lápices en el centro",10],["Cada persona propone una solución",90],["Dialogad hasta comprender todas las propuestas",60],["Recoged los lápices y escribid vuestro acuerdo",60]]],["1-2-4","💬","Papel y lápiz","Diseñad tres normas para un equipo de detectives.",[["Piensa individualmente",60],["Comparte tus ideas con tu pareja",90],["Poned en común las ideas de las dos parejas",120],["Acordad tres normas",60]]],["El puente cooperativo","🌉","Papel, cinta adhesiva y dos libros","Construid un puente de papel entre dos libros que sostenga una goma.",[["Repartid responsabilidades",60],["Diseñad el puente entre todos",90],["Construid y probad vuestro puente",240],["Mejorad el diseño juntos",90]]],["La misión secreta","🔐","Cuatro papeles","Descubrid el objeto misterioso compartiendo vuestras pistas.",[["Asignad un número del 1 al 4 a cada integrante",20],["Cada detective consulta su pista sin mostrarla",40],["Compartid oralmente las cuatro pistas",60],["Acordad el objeto misterioso",45]]],["El dibujo compartido","🎨","Folio y colores","Dibujad vuestra Academia ideal entre todos.",[["Acordad qué vais a dibujar",60],["Cada persona añade una parte",120],["Completad juntos los detalles",90],["Explicad cómo habéis colaborado",60]]]];let i=0,s=0,left=0,t=null;const a=document.querySelector('#app');function stop(){clearInterval(t);t=null}function home(){stop();a.innerHTML='<div class="grid">'+data.map((x,j)=>'<button class="tile" onclick="openTask('+j+')"><span class="emoji">'+x[1]+'</span><b>'+x[0]+'</b>Equipo de 4</button>').join('')+'</div>'}function openTask(j){stop();i=j;s=0;let x=data[i];a.innerHTML='<div class="panel"><button onclick="home()">← Técnicas</button><div class="emoji">'+x[1]+'</div><h2>'+x[0]+'</h2><p><b>Materiales:</b> '+x[2]+'</p><div class="task"><b>Vuestra misión</b><p>'+x[3]+'</p></div><p>Todos deben tener una oportunidad de participar. Podéis adaptar los tiempos.</p><button class="primary" onclick="step(0)">Comenzar misión</button></div>'}function step(n){stop();s=n;let x=data[i];if(s>=x[4].length){finish();return}left=x[4][s][1];a.innerHTML='<div class="panel"><button onclick="openTask(i)">← Volver</button><h2>'+x[0]+'</h2><p>Paso '+(s+1)+' de '+x[4].length+'</p><div class="bar"><div style="width:'+((s+1)/x[4].length*100)+'%"></div></div><h2>'+x[4][s][0]+'</h2>'+(i===4&&s===1?'<p>Consultad vuestra pista por turnos. Los demás apartan la mirada.</p><div>'+[1,2,3,4].map(j=>'<button onclick="clue('+j+')">Pista '+j+'</button>').join('')+'</div><p id="clue"></p>':'')+'<div id="clock"></div><p id="status" role="status"></p><button class="primary" id="play" onclick="toggle()">Iniciar tiempo</button><button onclick="step(s)">Reiniciar tiempo</button><button onclick="step(s+1)">Siguiente paso →</button></div>';clock()}function clue(j){document.querySelector('#clue').textContent=['Tiene hojas pero no es un árbol.','Puede contar una historia.','Nos ayuda a aprender.','Tiene páginas y una portada.'][j-1]}function clock(){document.querySelector('#clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function toggle(){if(t){stop();document.querySelector('#play').textContent='Continuar';return}if(left===0)return;document.querySelector('#play').textContent='Pausar';t=setInterval(()=>{left--;clock();if(left<=0){stop();document.querySelector('#status').textContent='Tiempo orientativo terminado. Avanzad cuando estéis preparados.';document.querySelector('#play').textContent='Tiempo terminado'}},1000)}function finish(){stop();a.innerHTML='<div class="panel"><h2>¡Misión completada!</h2>'+(i===4?'<p>Objeto misterioso: un libro.</p>':'')+'<p>Reflexionad juntos sobre vuestra cooperación.</p><div class="check">'+['Todas las personas han participado.','Hemos escuchado las ideas de los demás.','Hemos compartido responsabilidades.','Hemos llegado a acuerdos respetuosos.'].map(x=>'<label><input type="checkbox"> '+x+'</label>').join('')+'</div><p>¿Qué podemos mejorar la próxima vez?</p><button onclick="openTask(i)">Repetir</button><button class="primary" onclick="home()">Otra técnica</button></div>'}home()</script></html>
