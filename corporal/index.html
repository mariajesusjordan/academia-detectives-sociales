<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El mapa secreto de las emociones</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5dc;color:#344844;font:17px system-ui}main{max-width:1100px;margin:auto;padding:18px}header{background:#405e59;color:#fff8e8;padding:22px;border-radius:18px;text-align:center}h1,h2{font-family:Georgia}h1{margin:8px;font-size:36px}section{background:#faf5e9;border:1px solid #b9c6b8;padding:20px;border-radius:18px;margin:14px 0}button,select{font:inherit;padding:10px 15px;margin:4px;border:1px solid #8b9d91;border-radius:9px;background:#526f66;color:white;cursor:pointer}button.alt{background:#ded7e8;color:#443a58}button.active{background:#81698e;color:white}button:disabled{opacity:.5}textarea,input{font:inherit;width:100%;background:#fffdf5;border:1px solid #b9c6b8;border-radius:8px;padding:10px}label{display:block;margin:12px 0 5px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scanner{background:#dce6df;border-radius:18px;padding:10px;text-align:center;position:relative;overflow:hidden}.spot{cursor:pointer}.spot.mark circle{fill:#ab91c6;stroke:#493b60}.beam{position:absolute;left:0;right:0;height:4px;background:#7ba79a;box-shadow:0 0 14px #729e8d;transition:top 1s}.note{background:#e8deeb;padding:12px;border-radius:10px}footer{text-align:center;font-size:12px;margin-top:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{button,header small,.noprint{display:none!important}body{background:white}section{break-inside:avoid}}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · LABORATORIO CORPORAL</small><h1>El mapa secreto de las emociones</h1>Escucha las pistas de tu cuerpo</header><section id="v"></section><footer>© 2026 María Jesús Relaño · Somos Detectives Sociales</footer></main><script>const zones=["Cabeza","Cara","Pecho","Estómago","Manos","Piernas"],sens=[["Tensión","Calor","Dolor"],["Rubor","Lágrimas","Mandíbula tensa"],["Corazón acelerado","Presión","Respiración rápida"],["Mariposas","Nudo","Malestar"],["Sudor","Temblor","Tensión"],["Inquietud","Debilidad","Temblor"]],cases=[["La exposición","Vas a hablar delante de la clase y temes equivocarte."],["La sorpresa","Tus amigos te preparan una sorpresa."],["La discusión","Alguien rompe algo tuyo y te enfadas."],["La despedida","Una amiga cambia de colegio."],["La competición","Estás a punto de jugar una final."],["El descanso","Terminas una tarea difícil y puedes descansar."]],shape="<svg viewBox=\"0 0 200 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:440px\"><g fill=\"#dce5de\" stroke=\"#526e68\" stroke-width=\"2\"><circle cx=\"100\" cy=\"36\" r=\"27\"/><path d=\"M85 62 L75 78 54 85 23 167 39 175 70 118 71 194 57 302 83 302 100 210 117 302 143 302 129 194 130 118 161 175 177 167 146 85 125 78 115 62Z\"/></g><g class=\"spot\" data-zone=\"0\" tabindex=\"0\" role=\"button\" aria-label=\"Cabeza\" onclick=\"pick(0)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(0)}\"><circle cx=\"100\" cy=\"21\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"100\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">1</text></g><g class=\"spot\" data-zone=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"Cara\" onclick=\"pick(1)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(1)}\"><circle cx=\"100\" cy=\"46\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"100\" y=\"51\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">2</text></g><g class=\"spot\" data-zone=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"Pecho\" onclick=\"pick(2)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(2)}\"><circle cx=\"100\" cy=\"101\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"100\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">3</text></g><g class=\"spot\" data-zone=\"3\" tabindex=\"0\" role=\"button\" aria-label=\"Estómago\" onclick=\"pick(3)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(3)}\"><circle cx=\"100\" cy=\"152\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"100\" y=\"157\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">4</text></g><g class=\"spot\" data-zone=\"4\" tabindex=\"0\" role=\"button\" aria-label=\"Manos\" onclick=\"pick(4)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(4)}\"><circle cx=\"30\" cy=\"171\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"30\" y=\"176\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">5</text></g><g class=\"spot\" data-zone=\"5\" tabindex=\"0\" role=\"button\" aria-label=\"Piernas\" onclick=\"pick(5)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(5)}\"><circle cx=\"72\" cy=\"263\" r=\"13\" fill=\"#f6ead2\" stroke=\"#846d9b\" stroke-width=\"2\"/><text x=\"72\" y=\"268\" text-anchor=\"middle\" font-size=\"14\" fill=\"#443a58\">6</text></g></svg>";let mode=0,n=0,z=0,marks={},emotion='',need='';const v=document.querySelector('#v');function home(){v.innerHTML='<h2>Estación de investigación corporal</h2><p>El cuerpo puede darnos pistas. No todas las personas sienten lo mismo.</p><button onclick="start(1)">Modo investigación</button><button class="alt" onclick="start(2)">Exploración libre</button>'}function start(m){mode=m;n=0;reset()}function reset(){marks={};z=0;emotion="";need="";render()}function render(){v.innerHTML='<button onclick="home()">← Inicio</button><h2>'+(mode===1?cases[n][0]:'Así se siente mi cuerpo')+'</h2><p>'+(mode===1?cases[n][1]:'Observa cómo te sientes ahora. Puedes elegir no compartirlo.')+'</p><div class="grid"><div class="scanner">'+shape+'<p>Pulsa una zona del cuerpo</p></div><div><h3>'+zones[z]+'</h3>'+sens[z].map((s,i)=>'<button class="'+((marks[z]||[]).includes(s)?'active':'alt')+'" onclick="toggle('+i+')">'+s+'</button>').join('')+'<button class="alt" onclick="other()">Otra sensación</button><button class="alt" onclick="clearZone()">No noto nada aquí</button><h3>Mi mapa</h3><div id="summary"></div><label for="emotion">¿Qué emoción podría estar sintiendo?</label><input id="emotion" oninput="emotion=this.value"><label for="need">¿Qué podría necesitar ahora?</label><textarea id="need" rows="2" oninput="need=this.value"></textarea><p class="note">No hay un mapa correcto. Puedes sentir una emoción sin notar señales físicas.</p><button onclick="finish()">Finalizar mapa</button></div></div>';document.querySelector('#emotion').value=emotion;document.querySelector('#need').value=need;paint()}function paint(){document.querySelectorAll('.spot').forEach(e=>e.classList.toggle('mark',!!marks[e.dataset.zone]?.length));let s=document.querySelector('#summary');s.textContent='';Object.keys(marks).forEach(i=>{if(marks[i].length){let p=document.createElement('p');p.textContent=zones[i]+': '+marks[i].join(', ');s.append(p)}})}function pick(i){z=i;render()}function toggle(i){let a=marks[z]||[],s=sens[z][i];marks[z]=a.includes(s)?a.filter(x=>x!==s):[...a,s];render()}function clearZone(){marks[z]=[];render()}function other(){let s=prompt('¿Qué otra sensación notas?');if(s?.trim()){marks[z]=[...(marks[z]||[]),s.trim()];render()}}function finish(){render();let p=document.createElement('p');p.className='note';p.textContent='Mapa completado. Las señales son pistas, no diagnósticos. Si una sensación preocupa o duele, habla con un adulto.';v.append(p);let b=document.createElement('button');b.textContent=mode===1?'Siguiente caso':'Nuevo mapa';b.onclick=()=>{n=(n+1)%cases.length;reset()};v.append(b)}home()</script></body></html>
