<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detecta la emoción</title><style>*{box-sizing:border-box}body{margin:0;background:#e6dfcd;color:#41392c;font:18px system-ui}main{max-width:1000px;margin:auto;padding:20px}header,section{border:2px solid #b6a17c;border-radius:20px;padding:22px;margin:12px 0;background:#fff8e8}header{text-align:center;background:#46583e;color:#fff5dc}h1{font: bold 36px Georgia;margin:8px}h2{font:bold 28px Georgia;color:#46583e}button{font:inherit;padding:12px 17px;margin:5px;border:1px solid #99846a;border-radius:12px;background:#765573;color:white;cursor:pointer}button.clue{background:#e8dfc5;color:#41392c}button.sel{background:#536b43}button:disabled{opacity:.5}textarea{width:100%;font:inherit;padding:12px;border:1px solid #b6a17c;border-radius:9px;background:#fffdf6}.note{background:#e8eada;padding:15px;border-radius:12px}footer{text-align:center;font-size:12px}</style><main><header>ACADEMIA DE DETECTIVES SOCIALES · LABORATORIO DE EMOCIONES<h1>Detecta la emoción</h1>Observa · Investiga · Formula tu hipótesis</header><section id="v"></section><footer>© 2026 María Jesús Relaño · Somos Detectives Sociales</footer></main><script>const banks=[[["La exposición","Lucas tiene que exponer ante la clase.","Mira al suelo","Aprieta las manos","Habla muy bajito",["Miedo","Vergüenza","Nerviosismo"],"Puede preocuparle equivocarse delante del grupo."],["El regalo","Ana recibe un regalo inesperado.","Abre mucho los ojos","Sonríe","Da un salto",["Alegría","Sorpresa"],"La sorpresa puede ir acompañada de alegría."],["El recreo","Lucía está apartada del grupo.","Mira hacia abajo","Está callada","No quiere jugar",["Tristeza","Preocupación"],"Podría sentirse triste o estar preocupada por algo."],["La torre","La torre de Pablo se cae.","Frunce el ceño","Aprieta los puños","Suspira",["Enfado","Tristeza","Frustración"],"No conseguir lo que quería puede provocar frustración."],["El ruido","Se oye un ruido inesperado.","Se sobresalta","Abre los ojos","Retrocede",["Sorpresa","Miedo"],"Un ruido desconocido puede asustar."],["La carrera","Sara termina una carrera difícil.","Sonríe","Levanta los brazos","Busca a sus amigos",["Alegría","Orgullo"],"Puede estar satisfecha con su esfuerzo."],["El olor","Mario abre una fiambrera con mal olor.","Arruga la nariz","Aparta la cara","Cierra la tapa",["Asco"],"Su reacción puede indicar desagrado."],["El abrazo","Una amiga consuela a Julia.","Relaja los hombros","Sonríe suavemente","Respira despacio",["Calma","Alegría"],"Sentirse acompañada puede ayudarla a recuperar la calma."],["El juguete","A Leo le rompen su juguete.","Llora","Frunce el ceño","Sujeta el juguete",["Tristeza","Enfado"],"Puede sentir tristeza y enfado a la vez."],["La excursión","Mañana es la excursión de Inés.","Habla mucho del viaje","Sonríe","Le cuesta dormir",["Alegría","Nerviosismo"],"La ilusión también puede activar el cuerpo."]],[["La nota","Claudia mejora su nota, pero su amiga suspende.","Sonríe al ver su nota","Después mira a su amiga","Se acerca a ella",["Orgullo","Alegría","Preocupación"],"Puede celebrar su esfuerzo y preocuparse por su amiga."],["El mensaje","Hugo no recibe respuesta de su grupo.","Mira el móvil repetidamente","Suspira","No sabe qué ha pasado",["Inseguridad","Preocupación","Tristeza"],"No conocer la causa puede generar incertidumbre."],["La disculpa","Emma reconoce que difundió un rumor.","Evita la mirada","Pide perdón","Ofrece reparar el daño",["Culpa","Vergüenza"],"Puede lamentar su actuación y temer cómo la ven."],["La selección","Eligen a un amigo de Dani para el equipo.","Le felicita","Se queda callado después","También quería entrar",["Alegría","Envidia","Frustración"],"Puede alegrarse por su amigo y desear esa oportunidad."],["El cambio","Nora va a cambiar de colegio.","Habla de sus nuevos planes","Abraza a sus amigas","Pregunta cómo será el centro",["Tristeza","Ilusión","Preocupación"],"Los cambios pueden generar emociones mezcladas."],["La injusticia","A Samuel le atribuyen algo que no hizo.","Habla con firmeza","Frunce el ceño","Intenta explicarse",["Enfado","Frustración"],"Puede sentir que no le escuchan."],["La ayuda","Alicia recibe apoyo tras una dificultad.","Suspira","Sonríe","Da las gracias",["Alivio","Gratitud"],"El apoyo puede disminuir su preocupación."],["La actuación","Álex actúa ante todo el colegio.","Sonríe","Le tiemblan las manos","Ensaya repetidamente",["Ilusión","Nerviosismo","Miedo"],"Tener ganas de actuar no impide sentir nervios."],["La amistad","Una amiga de Eva juega con otra persona.","Las observa","Está callada","Quiere acercarse",["Celos","Inseguridad","Tristeza"],"Puede temer perder un vínculo, aunque no sabemos si es así."],["El proyecto","El equipo acaba un proyecto complicado.","Se felicitan","Respiran profundamente","Recuerdan el esfuerzo",["Orgullo","Alivio","Alegría"],"Terminar un reto puede provocar varias emociones."]]];let c=0,n=0,clues=[],sel=[],done=new Set(),reason='';const v=document.querySelector('#v');const emotions=['Alegría','Tristeza','Miedo','Enfado','Sorpresa','Asco','Calma','Vergüenza','Nerviosismo','Preocupación','Frustración','Orgullo','Inseguridad','Culpa','Envidia','Ilusión','Alivio','Gratitud','Celos'];function home(){v.innerHTML='<h2>Abre tu expediente</h2><p>Las pistas nos ayudan a formular hipótesis, pero solo la persona sabe cómo se siente.</p><button onclick="start(0)">Exploradores · 3º y 4º</button><button onclick="start(1)">Expertos · 5º y 6º</button>'}function start(i){c=i;done=new Set();menu()}function menu(){v.innerHTML='<h2>Expedientes investigados: '+done.size+'/10</h2>'+banks[c].map((a,i)=>'<button onclick="openCase('+i+')">'+(done.has(i)?'✓ ':'')+(i+1)+'. '+a[0]+'</button>').join('')+'<p><button onclick="home()">Cambiar nivel</button></p>'}function openCase(i){n=i;clues=[];sel=[];reason='';render()}function render(){let a=banks[c][n];v.innerHTML='<button onclick="menu()">← Expedientes</button><h2>🔎 '+a[0]+'</h2><p class="note">'+a[1]+'</p><h3>1. Descubre las pistas</h3>'+[0,1,2].map(i=>'<button class="clue" onclick="reveal('+i+')">'+(clues.includes(i)?a[i+2]:['🔍 Pista 1','🔍 Pista 2','🔍 Pista 3'][i])+'</button>').join('')+'<h3>2. ¿Qué podría sentir?</h3><p>Selecciona una o varias emociones.</p>'+emotions.slice(0,c===0?12:19).map(e=>'<button class="'+(sel.includes(e)?'sel':'')+'" aria-pressed="'+sel.includes(e)+'" onclick="choose(\''+e+'\')">'+e+'</button>').join('')+'<h3>3. Justifica tu hipótesis</h3><textarea id="reason" rows="3" placeholder="Creo que podría sentir… porque…" oninput="reason=this.value"></textarea><button onclick="finish()" '+(clues.length!==3||!sel.length?'disabled':'')+'>Resolver expediente</button><p id="msg" role="status"></p>';document.querySelector('#reason').value=reason}function reveal(i){if(!clues.includes(i))clues.push(i);render()}function choose(e){sel=sel.includes(e)?sel.filter(x=>x!==e):[...sel,e];render()}function finish(){if(!reason.trim()){document.querySelector('#msg').textContent='Explica primero qué pistas apoyan tu hipótesis.';return}let a=banks[c][n];done.add(n);v.innerHTML='<h2>Expediente investigado ✓</h2><p>Tu hipótesis: '+sel.join(', ')+'</p><p class="note">Posibles emociones: '+a[5].join(', ')+'. '+a[6]+'</p><p>Si has elegido otras emociones, explica qué pistas podrían apoyarlas. No podemos saber con certeza cómo se siente alguien sin preguntarle.</p><button onclick="openCase(n)">Volver a investigar</button><button onclick="menu()">Otro expediente</button>'}home()</script></html>
