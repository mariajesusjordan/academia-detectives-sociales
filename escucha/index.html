<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detectives de la escucha</title><style>*{box-sizing:border-box}body{margin:0;background:#23354c;color:#f8ecd7;font:18px system-ui}main{max-width:1050px;margin:auto;padding:22px}header,footer{text-align:center}h1{font: bold 42px Georgia;margin:10px;color:#f3d18d}h2{font-family:Georgia}small{letter-spacing:2px}.board{background:#394d65;border:2px solid #8294a5;border-radius:22px;padding:24px}.paper{background:#fff2d9;color:#354257;border-radius:12px;padding:24px;margin:18px 0;box-shadow:4px 5px #17283d;font-size:23px;line-height:1.45}.pin{width:18px;height:18px;background:#dc8a7d;border-radius:50%;margin:-15px auto 12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;border:2px solid #aebdca;border-radius:12px;background:#e4eaf0;color:#22364b;padding:14px;cursor:pointer}button:focus-visible{outline:4px solid white}button:disabled{opacity:.7;cursor:default}.good{background:#c4dfce}.mid{background:#f3dc9a}.bad{background:#e7aaa0}.primary{background:#f1d08e;border-color:#f1d08e}.feedback{margin:16px 0;background:#e7edf3;color:#22364b;padding:16px;border-radius:12px}.bar{height:10px;background:#18283b;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#f3d18d}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}footer{font-size:12px;margin:20px}.icon{font-size:35px;display:block}.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){h1{font-size:30px}.choices,.menu{grid-template-columns:1fr}.paper{font-size:19px}.board{padding:14px}}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · ESCUCHA ACTIVA</small><h1>Detectives de la Escucha</h1><p>Investiga las pistas y descubre cómo escuchamos.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["Mientras Ana habla, Luis espera a que termine para responder.",0,"Respetar el turno permite comprender el mensaje completo."],["Pablo mira su cuaderno mientras su compañera habla y pierde parte del mensaje.",1,"Puede apartar el cuaderno y centrar su atención en lo que escucha."],["Sara interrumpe a Leo para burlarse de lo que cuenta.",2,"Interrumpir y ridiculizar dificulta la comunicación y puede hacer daño."],["Nora pregunta qué significa una palabra que no ha entendido.",0,"Pedir aclaraciones ayuda a comprender."],["Hugo escucha, pero empieza a preparar su respuesta antes de que termine su amigo.",1,"Puede esperar a conocer todo el mensaje antes de pensar qué responder."],["Dani dice: «Entonces, ¿quieres jugar después del recreo?»",0,"Reformular permite comprobar que hemos entendido."],["Alba cambia de tema cuando su amiga intenta contarle algo importante.",2,"Cambiar de tema sin atender a la otra persona dificulta que se sienta escuchada."],["Leo responde «sí, sí» sin saber qué le han pedido.",1,"Es mejor reconocer que no ha entendido y pedir que se lo repitan."],["Eva deja tiempo a su compañero para encontrar las palabras.",0,"Respetar los silencios facilita la expresión."],["Marcos le dice a su compañero: «Cállate, no me interesa».",2,"Despreciar el mensaje impide una comunicación respetuosa."],["Inés resume lo que ha entendido y pregunta si es correcto.",0,"La reformulación ayuda a evitar malentendidos."],["Álex escucha un problema y enseguida ofrece consejos sin preguntar si los necesitan.",1,"Puede preguntar primero si la persona quiere consejo o solo ser escuchada."],["Julia comparte con el grupo un secreto que le han confiado, para reírse.",2,"Traicionar la confianza y ridiculizar dañan la comunicación."],["Omar dice: «No comparto tu opinión, pero quiero entender tus razones».",0,"Escuchar no implica estar de acuerdo."],["Marta mira el móvil durante una conversación y se pierde detalles.",1,"Puede guardar el móvil para prestar atención."],["Bruno termina las frases de su compañera aunque ella le pide que pare.",2,"Hay que respetar su ritmo y su petición."],["Claudia pregunta: «¿Te he entendido bien o quieres explicarme algo más?»",0,"Comprobar la comprensión evita dar cosas por supuestas."],["Samuel supone que su amigo está enfadado por su tono, sin comprobarlo.",1,"Puede preguntar cómo se siente en lugar de asumirlo."],["Adrián escucha únicamente para buscar errores y humillar a quien habla.",2,"Escuchar para atacar no favorece el diálogo."],["Eva escucha a una compañera que no mira a los ojos, sin exigirle que lo haga.",0,"La atención puede mostrarse de distintas formas; el contacto visual no es obligatorio."]];const a=document.querySelector('#app');let g=0,n=0,score=0,attempts=0,order=[];const names=['Buena pista','Pista mejorable','Pista falsa'];function home(){a.innerHTML='<div class="board"><h2>Tu misión</h2><p>Clasifica cada comportamiento según cómo influye en la escucha. No juzgamos a las personas: analizamos sus acciones.</p><div class="choices"><div>🟢 Buena pista: ayuda a escuchar.</div><div>🟡 Pista mejorable: necesita un ajuste.</div><div>🔴 Pista falsa: dificulta la escucha.</div></div><h2>Elige tu nivel</h2><div class="menu"><button onclick="start(0)">Detectives Exploradores<br>3.º y 4.º</button><button onclick="start(1)">Detectives Expertos<br>5.º y 6.º</button></div></div>'}function start(j){g=j;n=0;score=0;order=Array.from({length:10},(_,k)=>g*10+k);for(let k=9;k>0;k--){let l=Math.floor(Math.random()*(k+1));[order[k],order[l]]=[order[l],order[k]]}show()}function show(){attempts=0;let c=data[order[n]];a.innerHTML='<div class="board"><div class="top"><button onclick="home()">← Inicio</button><span>Expediente '+(n+1)+' de 10 · Aciertos a la primera: '+score+'</span></div><div class="bar"><div style="width:'+(n*10)+'%"></div></div><div class="paper"><div class="pin"></div><strong>🔎 Pista encontrada</strong><p>'+c[0]+'</p></div><h2>¿Cómo clasificarías esta conducta?</h2><div class="choices">'+names.map((s,k)=>'<button class="'+['good','mid','bad'][k]+'" onclick="answer('+k+')"><span class="icon">'+['✓','↻','×'][k]+'</span>'+s+'</button>').join('')+'</div><div id="feedback" role="status"></div></div>'}function answer(k){let c=data[order[n]],f=document.querySelector('#feedback');f.className='feedback';attempts++;if(k!==c[1]){f.textContent='Revisa la pista: ¿la persona puede terminar, sentirse respetada y ser comprendida? Inténtalo de nuevo.';return}if(attempts===1)score++;document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);f.innerHTML='<strong>¡Pista resuelta! '+names[k]+'</strong><p>'+c[2]+'</p><button class="primary" onclick="next()">Continuar →</button>'}function next(){n++;if(n<10){show();return}a.innerHTML='<div class="board"><h2>🏅 Expediente cerrado</h2><p>Has investigado las 10 pistas.</p><div class="paper">Aciertos a la primera: '+score+' de 10</div><p>Reflexiona: ¿qué hábito de escucha quieres practicar hoy? ¿Cómo sabrás que has mejorado?</p><button onclick="start(g)">Nueva investigación</button><button class="primary" onclick="home()">Cambiar nivel</button></div>'}home()</script></body></html>
