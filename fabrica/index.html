<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Fábrica de Mensajes Asertivos</title><style>*{box-sizing:border-box}body{margin:0;background:#e5eee5;color:#344e48;font:17px system-ui}main{max-width:1100px;margin:auto;padding:20px}header,footer{text-align:center}h1{font:bold 40px Georgia;margin:10px;color:#365f56}h2{font-family:Georgia}small{letter-spacing:2px}.panel{background:#fff9ed;border:2px solid #a5bdad;border-radius:24px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.piece{padding:16px;border-radius:16px;background:#d9e9dd;border:1px solid #a7bfb0}.piece:nth-child(2){background:#f4d9c9}.piece:nth-child(3){background:#e9e0f0}.piece:nth-child(4){background:#f2e5bc}label{display:block;font-weight:bold;margin-bottom:8px}textarea{width:100%;min-height:75px;resize:vertical;border:1px solid #879f91;border-radius:8px;padding:10px;font:inherit;background:#fffdf8;color:#344e48}button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #8aa598;background:white;color:#344e48;margin:4px;cursor:pointer}button.primary{background:#3d7163;color:white}.message{background:#fff;border:2px dashed #6b9383;padding:18px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:8px;flex-wrap:wrap}.note{padding:12px;background:#f4e7c9;border-radius:10px}footer{font-size:12px;margin:20px}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a2664d}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:30px}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · ASERTIVIDAD</small><h1>La Fábrica de Mensajes Asertivos</h1><p>Cuatro piezas para expresar lo que sientes y necesitas.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["Un compañero coge tus colores sin preguntar.","enfadado/a","coges mis colores sin preguntar","los necesito para trabajar","me pidieras permiso antes"],["No te dejan participar en un juego.","triste","no me dejáis participar","también quiero jugar","buscáramos una forma de incluirme"],["Te interrumpen mientras hablas.","molesto/a","me interrumpes","quiero terminar mi idea","esperaras a que termine"],["Alguien estropea tu dibujo.","triste","se estropea mi dibujo","he dedicado tiempo a hacerlo","tuviéramos más cuidado"],["Te piden algo que no quieres prestar.","incómodo/a","insistes en que te lo preste","ahora lo necesito","respetaras mi decisión"],["Un compañero no entiende tu explicación.","preocupado/a","no conseguimos entendernos","quiero ayudarte","me dijeras qué parte no entiendes"],["Tu grupo decide sin consultarte.","frustrado/a","tomáis decisiones sin preguntarme","quiero participar en el trabajo","escucharais mi propuesta"],["Difunden un rumor sobre ti.","dolido/a","compartes información sobre mí sin comprobarla","afecta a mi confianza","dejaras de compartirla"],["Un amigo insiste en que hagas algo que no quieres.","incómodo/a","insistes después de que diga que no","necesito decidir por mí mismo/a","respetaras mi negativa"],["Te corrigen delante de toda la clase.","avergonzado/a","me corriges delante de todos","me cuesta concentrarme así","me lo dijeras en privado"],["No cumplen su parte del trabajo.","preocupado/a","no terminamos las tareas acordadas","el equipo depende de todos","repartiéramos de nuevo las tareas"],["Un compañero hace bromas sobre ti.","molesto/a","haces bromas sobre mí","no me resultan divertidas","dejaras de hacerlas"]],a=document.querySelector('#app');let g=0,n=0,free=false;const labels=['Me siento…','Cuando…','Porque…','Me gustaría…'],tips=['Nombra una emoción.','Describe lo ocurrido sin insultos ni suposiciones.','Explica cómo te afecta o qué necesitas.','Pide un cambio concreto y respetuoso.'];function home(){a.innerHTML='<div class="panel"><h2>Elige tu modo de entrenamiento</h2><p>Expresar lo que sentimos no significa atacar ni tener que ceder.</p><div class="row"><button onclick="start(0)">Exploradores · 3.º y 4.º</button><button onclick="start(1)">Expertos · 5.º y 6.º</button><button class="primary" onclick="start(2)">Modo libre · Mi propio mensaje</button></div></div>'}function start(j){free=j===2;g=j;n=0;show()}function show(){let c=free?null:data[g*6+n];a.innerHTML='<div class="panel"><div class="row"><button onclick="home()">← Inicio</button>'+(!free?'<button onclick="n=(n+1)%6;show()">Otra situación →</button>':'')+'</div><h2>'+(free?'Tu propia situación':'Reto '+(n+1)+' de 6')+'</h2><p>'+(free?'Piensa en una situación. No hace falta escribir nombres ni datos personales.':c[0])+'</p><div class="grid">'+labels.map((x,i)=>'<div class="piece"><label for="p'+i+'">'+(i+1)+' · '+x+'</label><p>'+tips[i]+'</p><textarea id="p'+i+'" maxlength="300" placeholder="'+['triste, molesto/a, preocupado/a…','ocurre algo concreto…','necesito…','me pidieras…, pudiéramos…'][i]+'"></textarea></div>').join('')+'</div><div class="row"><button class="primary" onclick="build()">⚙️ Fabricar mensaje</button>'+(!free?'<button onclick="example()">Ver ejemplo</button>':'')+'<button onclick="clearAll()">Limpiar piezas</button></div><div id="out" aria-live="polite"></div><p class="note">Si alguien te amenaza, agrede o no respeta tus límites repetidamente, pide ayuda a una persona adulta de confianza. No necesitas resolverlo solo/a.</p></div>'}function vals(){return labels.map((_,i)=>document.querySelector('#p'+i).value.trim().replace(/[.!?]+$/,''))}function clearAll(){labels.forEach((_,i)=>document.querySelector('#p'+i).value='');document.querySelector('#out').replaceChildren()}function example(){let c=data[g*6+n];labels.forEach((_,i)=>document.querySelector('#p'+i).value=c[i+1]);build()}function build(){let v=vals(),o=document.querySelector('#out');o.replaceChildren();if(v.some(x=>!x)){o.textContent='Completa las cuatro piezas antes de fabricar tu mensaje.';return}let h=document.createElement('h2');h.textContent='¡Mensaje fabricado!';let p=document.createElement('div');p.className='message';p.textContent='Me siento '+v[0]+' cuando '+v[1]+', porque '+v[2]+'. Me gustaría que '+v[3]+'.';o.append(h,p);let t=document.createElement('h3');t.textContent='Control de calidad del detective';o.append(t);['He expresado mi emoción.','He descrito lo ocurrido sin atacar.','He explicado mi necesidad.','Mi petición es concreta y respetuosa.'].forEach(x=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';l.append(c,' '+x);o.append(l)});let b=document.createElement('button');b.textContent='Leer en voz alta';b.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(p.textContent);u.lang='es-ES';speechSynthesis.speak(u)}else{b.textContent='Voz no disponible'}};o.append(b);let r=document.createElement('p');r.textContent='¿Cómo podrías decirlo con un tono tranquilo y firme? El mensaje es una propuesta: revísalo antes de utilizarlo.';o.append(r)}home()</script></html>
