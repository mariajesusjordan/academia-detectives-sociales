<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El misterio de las huellas</title><style>*{box-sizing:border-box}body{margin:0;background:#e8dfce;color:#443729;font:18px system-ui}main{max-width:1050px;margin:auto;padding:20px}header,section{border:2px solid #b49b70;border-radius:18px;padding:20px;margin:12px 0;background:#fff9ec}header{text-align:center;background:#46583e;color:#fff4dc}h1{font:bold 36px Georgia;margin:8px}h2{font:bold 26px Georgia;color:#46583e}button{font:inherit;border:1px solid #a38b66;border-radius:10px;background:#765573;color:white;padding:12px;margin:5px;cursor:pointer}button.choice{display:block;width:100%;text-align:left;background:#e7ebd9;color:#443729}label{display:block;font-weight:bold;margin:8px 0}textarea,input{width:100%;font:inherit;border:1px solid #b49b70;border-radius:9px;padding:10px;background:#fffdf6;color:#443729}footer{text-align:center;font-size:12px}.note{background:#ece2ed;padding:16px;border-radius:10px}.trail{font-size:32px;text-align:center;letter-spacing:10px}.printvalue{display:none}@page{size:A4;margin:12mm}@media print{body{background:white;font-size:10pt}main{padding:0}header,section{padding:10px;margin:6px 0;break-inside:avoid}h1{font-size:22pt}h2{font-size:14pt}button,.private,input,textarea{display:none}.printvalue{display:block;white-space:pre-wrap;overflow-wrap:anywhere;min-height:45px;border-bottom:1px solid #b49b70}*{print-color-adjust:exact}}</style></head><body><main><header>ACADEMIA DE DETECTIVES SOCIALES<h1>El misterio de las huellas</h1>Cada paso deja una huella.</header><section id="v"></section><footer>© 2026 María Jesús Relaño · Somos Detectives Sociales</footer></main><script>const banks=[[["Un compañero nuevo","Un compañero está solo en el recreo.",["Invitarle a jugar","Seguir jugando","Preguntarle si quiere compañía"],["Se acerca al grupo, aunque todavía está tímido.","Sigue solo y no sabes si quiere compañía.","Te cuenta que no conoce a nadie."]],["El dibujo","Estropeas sin querer el dibujo de una compañera.",["Contárselo","Esconderlo","Pedir ayuda para arreglarlo"],["Se disgusta, pero conoce lo sucedido.","Busca su dibujo sin saber qué pasó.","Podéis intentar repararlo juntos."]],["El turno","Te cuelas en la fila sin querer.",["Volver a tu sitio","Quedarte delante","Preguntar dónde acaba la fila"],["Se recupera el orden.","Otros protestan por el turno.","Encuentras tu lugar sin discutir."]],["La partida","Pierdes un juego y te enfadas.",["Tomar un descanso","Acusar al ganador","Pedir otra partida con calma"],["Recuperas la tranquilidad.","El ganador se siente acusado.","El grupo puede seguir jugando."]],["El secreto","Un amigo te cuenta algo privado.",["Respetar su confianza","Contarlo para divertir","Preguntar si necesita ayuda"],["Tu amigo conserva su confianza.","El secreto circula y tu amigo se preocupa.","Tu amigo puede pedir apoyo si lo necesita."]],["Los materiales","Solo queda un rotulador que dos necesitáis.",["Compartir por turnos","Quitárselo","Buscar otro color"],["Ambos podéis avanzar.","La discusión aumenta.","Encuentras una alternativa."]]],[["El rumor","Te llega un rumor sobre una compañera.",["No difundirlo","Reenviarlo","Buscar apoyo si puede hacer daño"],["Evitas ampliar el rumor.","Más personas reciben información no comprobada.","Un adulto puede ayudar a protegerla."]],["El equipo","Tu grupo ignora la idea de un compañero.",["Pedir que la escuchen","Callar por comodidad","Proponer valorar todas las ideas"],["El compañero tiene oportunidad de participar.","Su propuesta queda fuera.","El equipo dispone de más alternativas."]],["El mensaje","Recibes un mensaje que parece ofensivo.",["Preguntar con calma si es seguro","Responder insultando","Esperar y pedir apoyo"],["Puedes aclarar la intención.","El conflicto puede intensificarse.","Tienes tiempo para valorar qué hacer."]],["La presión","Tus amigos quieren que te burles de alguien.",["Negarte","Unirte a las burlas","Alejarte y pedir ayuda"],["Marcas un límite claro.","La persona puede sentirse herida.","Buscas apoyo para detener el daño."]],["La crítica","Haces un comentario hiriente sobre un trabajo.",["Reconocerlo","Justificarte","Ofrecer una crítica respetuosa"],["Abres una posibilidad de reparación.","La otra persona puede sentirse invalidada.","Puedes aportar información útil sin atacar."]],["La exclusión","El grupo deja fuera a una persona repetidamente.",["Avisar a un adulto","Ignorarlo","Proponer incluirla y buscar apoyo"],["Un adulto puede intervenir.","La exclusión puede continuar.","Promueves la inclusión sin asumir toda la responsabilidad."]]]];let c=0,n=0,k=0,seen=new Set();const v=document.getElementById('v');function home(){v.innerHTML='<h2>El camino de las decisiones</h2><p>Explora historias, descubre sus consecuencias y decide cómo continuar. No hay puntuaciones.</p><button onclick="start(0)">3º y 4º de Primaria</button><button onclick="start(1)">5º y 6º de Primaria</button>'}function start(i){c=i;seen=new Set();menu()}function menu(){v.innerHTML='<h2>Elige una historia</h2><p>Historias exploradas: '+seen.size+'/6</p>'+banks[c].map((a,i)=>'<button onclick="story('+i+')">'+(seen.has(i)?'👣 ':'')+a[0]+'</button>').join('')+'<p><button onclick="home()">Cambiar ciclo</button></p>'}function story(i){n=i;let a=banks[c][n];v.innerHTML='<div class="trail">👣 👣</div><h2>'+a[0]+'</h2><p>'+a[1]+'</p><h3>¿Qué decides hacer?</h3>'+a[2].map((x,j)=>'<button class="choice" onclick="consequence('+j+')">'+x+'</button>').join('')+'<button onclick="menu()">Volver</button>'}function consequence(j){k=j;let a=banks[c][n];v.innerHTML='<div class="trail">👣 👣 👣</div><h2>La huella de tu decisión</h2><p>Has decidido: '+a[2][j]+'</p><p class="note">'+a[3][j]+'</p><p>¿Cómo puede sentirse cada persona? ¿Qué ha cambiado?</p><h3>¿Cómo quieres continuar?</h3><button class="choice" onclick="end(0)">Hablar y escuchar cómo se sienten</button><button class="choice" onclick="end(1)">Mantener mi decisión y observar sus efectos</button><button class="choice" onclick="end(2)">Buscar apoyo de una persona adulta</button><button onclick="story(n)">Explorar otra decisión</button>'}function end(j){seen.add(n);let a=banks[c][n];let endings=['Al conversar puedes conocer otras perspectivas. Si has causado daño, puedes reconocerlo, disculparte y ofrecer una reparación concreta.','Mantener una acción respetuosa puede ayudar; si observas daño o malestar, todavía puedes cambiar de rumbo y reparar.','Una persona adulta puede ayudar a valorar lo ocurrido y proteger a quienes lo necesiten.'];v.innerHTML='<div class="trail">👣 👣 👣 👣</div><h2>Tu camino continúa</h2><p>'+a[3][k]+'</p><p class="note">'+endings[j]+'</p><h3>Reflexión final</h3><p>¿Qué huella quieres dejar? ¿Qué harías de manera diferente la próxima vez?</p><p>Ante acoso, amenazas o agresiones, busca ayuda adulta.</p><button onclick="story(n)">Explorar otro camino</button><button onclick="menu()">Otra historia</button>'}home()</script></body></html>
