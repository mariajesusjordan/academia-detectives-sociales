<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escudo de la Cooperación</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e1d3;color:#243b50;font:17px system-ui}main{max-width:850px;margin:auto;padding:20px}header{text-align:center;background:#42664c;color:#fff3d5;border:4px double #e9c77c;border-radius:18px;padding:20px}h1,h2{font-family:Georgia,serif}h1{margin:8px 0}article{background:#fff9ed;border:1px solid #c8b58f;border-radius:14px;padding:22px;margin:16px 0}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea{display:block;width:100%;padding:12px;border:1px solid #b9af98;border-radius:8px;font:inherit;background:#fffdf7}textarea{min-height:85px}button{background:#42664c;color:white;border:1px solid #bba36c;border-radius:9px;padding:12px 19px;font:600 16px system-ui;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a78bb5}nav{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}input[type=checkbox]{accent-color:#42664c;width:19px;height:19px;vertical-align:middle;margin-right:8px}svg{display:block;width:260px;max-width:100%;margin:18px auto}progress{width:100%;accent-color:#42664c}footer{text-align:center;font-size:12px;margin:24px 0}button[hidden]{display:none}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES</small><h1>Escudo de la Cooperación</h1>Una misión. Un equipo. Un objetivo común.</header><svg viewBox="0 0 300 280" role="img" aria-label="Escudo de cuatro poderes"><defs><clipPath id="clip"><path d="M18 30 Q150 0 282 30 L268 145 Q250 232 150 270 Q50 232 32 145Z"/></clipPath></defs><g clip-path="url(#clip)"><path id="q0" d="M0 0H150V140H0Z"/><path id="q1" d="M150 0H300V140H150Z"/><path id="q2" d="M0 140H150V280H0Z"/><path id="q3" d="M150 140H300V280H150Z"/><path d="M150 0V280M0 140H300" stroke="#c3a36b" stroke-width="5"/></g><path d="M18 30 Q150 0 282 30 L268 145 Q250 232 150 270 Q50 232 32 145Z" fill="none" stroke="#bd9e65" stroke-width="7"/><g text-anchor="middle" fill="#243b50" font-size="11" font-weight="bold"><text x="86" y="82" font-size="28">👂</text><text x="86" y="106">ESCUCHAMOS</text><text x="214" y="82" font-size="28">🤝</text><text x="214" y="106">COLABORAMOS</text><text x="94" y="177" font-size="26">💡</text><text x="94" y="197">SOLUCIONES</text><text x="206" y="177" font-size="26">🎯</text><text x="206" y="197">OBJETIVO</text></g><circle cx="150" cy="140" r="23" fill="#42664c" stroke="#e9c77c" stroke-width="4"/><text x="150" y="149" text-anchor="middle" fill="#e9c77c" font-size="26">★</text></svg><div id="progressText" aria-live="polite"></div><progress id="progress" max="4" value="0"></progress><article id="stage"></article><nav><button id="back">Anterior</button><span id="step"></span><button id="next">Comenzar</button></nav><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.<br>Las respuestas se mantienen únicamente en esta sesión del navegador. Evitad introducir datos personales.</footer></main><script>
const powers=[['Escuchamos y respetamos','¿Qué ideas diferentes hemos escuchado? ¿Cómo las hemos tenido en cuenta?',['Hemos respetado los turnos de palabra.','Hemos escuchado sin interrumpir ni ridiculizar.','Todas las personas han podido participar.']],['Aportamos y colaboramos','¿Cómo hemos repartido las tareas? ¿Qué ha aportado cada persona?',['Hemos repartido las tareas de forma justa.','Cada integrante ha asumido su responsabilidad.','Hemos ayudado a quien lo necesitaba.']],['Buscamos soluciones','¿Qué dificultad hemos encontrado y cómo la hemos resuelto?',['Hemos valorado diferentes propuestas.','Hemos buscado acuerdos sin imponer nuestras ideas.','Hemos tomado las decisiones contando con el equipo.']],['Cumplimos el objetivo','¿Qué hemos conseguido? ¿Qué podemos mejorar?',['Hemos cumplido nuestras responsabilidades.','Hemos revisado juntos el resultado.','Hemos reconocido las aportaciones de los demás.']]];let page=0,v={};const $=id=>document.getElementById(id),colors=['#a1b49a','#bda5c8','#e9c77c','#9ab7c8'];function done(i){return powers[i][2].every((_,j)=>v['c'+i+j])}function update(){let n=powers.filter((_,i)=>done(i)).length;$('progress').value=n;$('progressText').textContent=n+' de 4 poderes conseguidos';powers.forEach((_,i)=>$('q'+i).setAttribute('fill',done(i)?colors[i]:'#d9d4c6'))}function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function field(k,label,small=false){return '<label>'+label+(small?'<input data-k="'+k+'" value="'+esc(v[k])+'">':'<textarea data-k="'+k+'">'+esc(v[k])+'</textarea>')+'</label>'}function render(){let s=$('stage');if(!page)s.innerHTML='<h2>Expediente del equipo</h2><p>Preparad vuestra misión antes de empezar. Al terminar, revisad los cuatro poderes del escudo.</p>'+field('team','Nombre del equipo',true)+field('members','Integrantes (alias o iniciales)')+field('goal','Objetivo común');else if(page<5){let i=page-1,p=powers[i];s.innerHTML='<h2>'+page+'. '+p[0]+'</h2>'+field('r'+i,p[1])+'<p>Marcamos solamente aquello que hemos conseguido de verdad:</p>'+p[2].map((c,j)=>'<label><input type="checkbox" data-k="c'+i+j+'" '+(v['c'+i+j]?'checked':'')+'>'+c+'</label>').join('')}else{s.innerHTML='<h2>'+ (powers.every((_,i)=>done(i))?'¡Escudo completado!':'Nuestro equipo sigue creciendo')+'</h2>'+powers.map((p,i)=>'<p>'+(done(i)?'✓':'○')+' '+p[0]+'</p>').join('')+field('commit','Nuestro compromiso para el próximo trabajo')+'<button id="save">Guardar informe</button> <button id="reset">Nueva misión</button>';$('save').onclick=save;$('reset').onclick=()=>{if(confirm('¿Deseáis iniciar una nueva misión y borrar las respuestas actuales?')){v={};page=0;render()}}}s.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{v[e.dataset.k]=e.type==='checkbox'?e.checked:e.value;update()});$('back').hidden=page===0;$('next').hidden=page===5;$('next').textContent=page===0?'Comenzar':page===4?'Ver resultado':'Siguiente';$('step').textContent=['Preparación','Poder 1','Poder 2','Poder 3','Poder 4','Reflexión final'][page];update()}function save(){let t='ESCUDO DE LA COOPERACIÓN\nEquipo: '+(v.team||'')+'\nIntegrantes: '+(v.members||'')+'\nObjetivo: '+(v.goal||'')+'\n\n'+powers.map((p,i)=>p[0]+'\n'+p[2].map((c,j)=>(v['c'+i+j]?'✓ ':'○ ')+c).join('\n')+'\nReflexión: '+(v['r'+i]||'')).join('\n\n')+'\n\nCompromiso: '+(v.commit||'');let u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Escudo_de_la_cooperacion.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('back').onclick=()=>{if(page>0){page--;render()}};$('next').onclick=()=>{if(page<5){page++;render()}};render();</script></body></html>
