<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Colección de Insignias</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e0cc;color:#344c46;font:17px system-ui}main{max-width:1050px;margin:auto;padding:20px}header,footer{text-align:center}h1{font:bold 40px Georgia;margin:10px;color:#31564c}h2{font-family:Georgia}small{letter-spacing:2px}.cabinet{background:#345950;border:9px double #af9160;border-radius:24px;padding:18px;box-shadow:0 6px 0 #a68d69}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{background:#eee4cf;border:2px solid #bfa77a;border-radius:14px;padding:14px;cursor:pointer;text-align:center;color:#344c46;font:inherit}.medal{display:grid;place-items:center;width:100px;height:100px;margin:4px auto 12px;border-radius:50%;background:var(--c);border:7px double #fff0c5;box-shadow:0 0 0 3px #a8864f;font-size:48px}.locked .medal{filter:grayscale(.9);opacity:.65}.tile strong{display:block;font: bold 20px Georgia}.tile span.state{display:block;margin-top:9px;font-size:14px}.panel{background:#fff8e9;border:2px solid #bda77e;border-radius:20px;padding:22px}.panel .medal{width:115px;height:115px}.bar{height:12px;background:#d8cdb5;border-radius:8px;overflow:hidden}.bar div{background:#608d79;height:100%}button,input{font:inherit}button{cursor:pointer;padding:10px 16px;border:1px solid #9d8964;background:#fff5df;color:#344c46;border-radius:10px;margin:4px}button.primary{background:#345950;color:white}button:focus-visible,input:focus-visible{outline:3px solid #b36c38}label{display:flex;align-items:center;gap:12px;padding:14px;background:#f0e9d9;border-radius:10px;margin:10px 0}input[type=checkbox]{width:22px;height:22px;flex-shrink:0}footer{font-size:12px;margin:18px}.note{font-size:14px;color:#53665e}.profiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}select{font:inherit;padding:8px;border-radius:8px} @media(max-width:650px){.grid{grid-template-columns:1fr 1fr}h1{font-size:29px}.medal{width:75px;height:75px;font-size:35px}.tile strong{font-size:16px}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · TAQUILLA DEL DETECTIVE</small><h1>Mi Colección de Insignias</h1><p>Cada pequeño logro cuenta. ¡Celebra tus avances!</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["Guardián de las emociones","🌈","#7ca99c","Gestión emocional",["He identificado y nombrado una emoción que sentía.","He practicado una estrategia del maletín de la calma.","He expresado cómo me siento sin hacer daño."]],["Explorador de corazones","💜","#b29acb","Empatía",["He preguntado a alguien cómo se siente.","He intentado comprender un punto de vista diferente.","He ofrecido ayuda respetando lo que la otra persona necesita."]],["Maestro de la escucha","🎧","#83a9c9","Escucha activa",["He dejado que alguien termine de hablar.","He preguntado cuando no entendía algo.","He comprobado con mis palabras lo que había entendido."]],["Detective de la palabra","💬","#d29385","Asertividad",["He expresado una opinión con respeto.","He dicho que no o puesto un límite sin atacar.","He practicado un mensaje en primera persona."]],["Aliado del equipo","🤝","#a1b67c","Cooperación",["He cumplido mi responsabilidad en un equipo.","He escuchado y valorado las ideas de los demás.","He ayudado a que todos puedan participar."]],["Experto en soluciones","💡","#d9b66e","Resolución de conflictos",["He utilizado una estrategia para detenerme antes de actuar.","He pensado en varias soluciones a un desacuerdo.","He buscado un acuerdo respetuoso o pedido ayuda cuando era necesario."]]],a=document.querySelector('#app'),key='detectives-insignias-v1';let profile=0,all={},stored=true;try{all=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){stored=false}function current(){if(!Array.isArray(all[profile]))all[profile]=data.map(()=>[false,false,false]);return all[profile]}function save(){try{localStorage.setItem(key,JSON.stringify(all))}catch(e){stored=false}}function count(i){return current()[i].filter(Boolean).length}function badge(i){return '<div class="medal" style="--c:'+data[i][2]+'">'+data[i][1]+'</div>'}function home(){let total=data.filter((_,i)=>count(i)===3).length;a.innerHTML='<div class="panel"><div class="profiles"><label for="profile" style="padding:0;background:none">Mi taquilla:</label><select id="profile" onchange="profile=Number(this.value);home()">'+Array.from({length:30},(_,i)=>'<option value="'+i+'" '+(i===profile?'selected':'')+'>Detective '+(i+1)+'</option>').join('')+'</select></div><p><b>'+total+' de 6 insignias conseguidas</b></p><div class="bar"><div style="width:'+total/6*100+'%"></div></div><p class="note">Utiliza un número asignado por tu docente. El progreso se guarda solo en este navegador si permite almacenamiento. No introduzcas nombres.</p>'+(!stored?'<p>El almacenamiento no está disponible: el progreso puede perderse al cerrar.</p>':'')+'</div><div class="cabinet"><div class="grid">'+data.map((x,i)=>'<button class="tile '+(count(i)<3?'locked':'')+'" onclick="openBadge('+i+')">'+badge(i)+'<strong>'+x[0]+'</strong><span>'+x[3]+'</span><span class="state">'+(count(i)===3?'✓ Conseguida':'🔒 '+count(i)+' de 3 retos')+'</span></button>').join('')+'</div></div><p class="note">Marca únicamente los retos que hayas practicado de verdad. Puedes comentarlos con tu docente.</p><button onclick="resetProfile()">Reiniciar mi colección</button>'}function openBadge(i){let x=data[i];a.innerHTML='<div class="panel"><button onclick="home()">← Mi colección</button>'+badge(i)+'<h2>'+x[0]+'</h2><p>'+x[3]+'</p><p>Recuerda momentos reales en los que hayas practicado estos retos.</p>'+x[4].map((s,j)=>'<label><input type="checkbox" '+(current()[i][j]?'checked':'')+' onchange="mark('+i+','+j+',this.checked)">'+s+'</label>').join('')+'<h3 id="status" role="status"></h3><p>¿En qué situación has puesto en práctica esta habilidad? ¿Qué te gustaría mejorar?</p><button class="primary" onclick="home()">Volver a la vitrina</button></div>';status(i)}function mark(i,j,v){current()[i][j]=v;save();status(i)}function status(i){document.querySelector('#status').textContent=count(i)===3?'🎉 ¡Insignia conseguida!':count(i)+' de 3 retos completados'}function resetProfile(){if(confirm('¿Reiniciar los retos de esta taquilla?')){delete all[profile];save();home()}}home()</script></html>
