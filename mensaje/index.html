<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Mensaje Perdido</title><style>*{box-sizing:border-box}body{margin:0;background:#eee0d5;color:#4f3e45;font:17px system-ui}main{max-width:1000px;margin:auto;padding:20px}header,footer{text-align:center}h1,h2{font-family:Georgia;color:#974f59}h1{font-size:42px;margin:10px}.panel{background:#fff8ec;border:2px solid #c5a18e;padding:20px;border-radius:20px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}button{font:inherit;background:#f3e3cc;border:1px solid #ad8d79;color:#543f45;padding:12px;border-radius:12px;cursor:pointer;margin:4px}button.primary{background:#965665;color:white}button:focus-visible{outline:3px solid #33796e}svg{width:min(100%,460px);background:#fff;border:2px solid #c7b39b;border-radius:9px}.note{background:#dce9e2;padding:12px;border-radius:12px}footer{font-size:12px;margin:20px}small{letter-spacing:2px}label{display:block;text-align:left;margin:12px auto;max-width:600px}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES</small><h1>El Mensaje Perdido</h1><p>Un mensaje, dos detectives y una misión compartida.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["La casa","<rect x='85' y='100' width='150' height='110' fill='#e7bd86'/><path d='M65 100L160 25L255 100Z' fill='#aa6557'/><rect x='145' y='150' width='35' height='60' fill='#795c46'/><circle cx='275' cy='42' r='23' fill='#e8c65e'/>"],["El robot","<rect x='105' y='30' width='110' height='70' rx='10' fill='#9ab9c2'/><circle cx='135' cy='60' r='8'/><circle cx='185' cy='60' r='8'/><rect x='115' y='110' width='90' height='75' fill='#c68a76'/><path d='M115 125L65 160M205 125L255 160M135 185V225M185 185V225' stroke='#617b83' stroke-width='12'/>"],["El barco","<path d='M50 170H270L230 215H90Z' fill='#a8754d'/><path d='M160 35V170H65Z' fill='#9bbcb0'/><path d='M170 55L245 150H170Z' fill='#e3b96e'/>"],["El jardín","<rect x='0' y='190' width='320' height='50' fill='#a1b58b'/><path d='M80 190V85M160 190V110M240 190V65' stroke='#617c55' stroke-width='8'/><circle cx='80' cy='80' r='30' fill='#bf8496'/><circle cx='160' cy='100' r='25' fill='#e1bc65'/><circle cx='240' cy='60' r='35' fill='#a897c0'/>"],["La bandera","<path d='M80 25V225' stroke='#705947' stroke-width='8'/><rect x='85' y='30' width='160' height='100' fill='#8faeb9'/><circle cx='165' cy='80' r='30' fill='#e2b95e'/>"],["El tren","<rect x='35' y='100' width='110' height='75' fill='#9db597'/><rect x='160' y='75' width='120' height='100' fill='#b87b68'/><rect x='175' y='90' width='35' height='35' fill='#b7d6df'/><path d='M145 150H160' stroke='#65513e' stroke-width='8'/><circle cx='65' cy='190' r='20' fill='#64594d'/><circle cx='120' cy='190' r='20' fill='#64594d'/><circle cx='190' cy='190' r='20' fill='#64594d'/><circle cx='250' cy='190' r='20' fill='#64594d'/>"],["El mapa secreto","<path d='M40 200L70 65L170 100L250 40L280 180L180 220L90 190Z' fill='#e6d3a0' stroke='#9d855e' stroke-width='3'/><path d='M70 160Q120 50 180 160T250 80' fill='none' stroke='#88674d' stroke-dasharray='7 6' stroke-width='4'/><path d='M235 65L265 95M265 65L235 95' stroke='#b45c50' stroke-width='7'/><circle cx='85' cy='125' r='17' fill='#8aa57d'/>"],["La clave geométrica","<rect x='35' y='35' width='250' height='175' fill='none' stroke='#9f8067' stroke-width='4'/><circle cx='90' cy='85' r='27' fill='#89a8bc'/><path d='M160 45L195 110H125Z' fill='#c58d75'/><rect x='220' y='60' width='45' height='45' fill='#a4b88b'/><path d='M80 160H250' stroke='#b79a68' stroke-width='6' stroke-dasharray='12 8'/><circle cx='160' cy='185' r='12' fill='#aa8cb3'/>"],["El escritorio","<rect x='25' y='150' width='270' height='20' fill='#a77c5b'/><rect x='45' y='80' width='65' height='70' fill='#8fa6b6'/><circle cx='78' cy='105' r='18' fill='#e7c770'/><rect x='130' y='120' width='90' height='30' fill='#bd8778'/><path d='M250 150V55L210 75H290L250 55' fill='#a4b58c' stroke='#66795d' stroke-width='4'/><path d='M50 170V230M270 170V230' stroke='#a77c5b' stroke-width='12'/>"],["La constelación","<rect width='320' height='240' fill='#35465b'/><path d='M40 175L95 70L160 125L230 40L280 160' stroke='#c2d8db' stroke-dasharray='6 6' fill='none' stroke-width='3'/><circle cx='40' cy='175' r='9' fill='#edd48b'/><circle cx='95' cy='70' r='9' fill='#edd48b'/><circle cx='160' cy='125' r='9' fill='#edd48b'/><circle cx='230' cy='40' r='9' fill='#edd48b'/><circle cx='280' cy='160' r='9' fill='#edd48b'/><circle cx='255' cy='200' r='20' fill='#b3b8d2'/>"],["La ciudad","<rect x='20' y='100' width='70' height='120' fill='#ba8d77'/><rect x='110' y='45' width='90' height='175' fill='#9db0c2'/><rect x='220' y='130' width='80' height='90' fill='#a2b58b'/><rect x='130' y='65' width='20' height='20' fill='#f5e5b8'/><rect x='160' y='65' width='20' height='20' fill='#f5e5b8'/><rect x='130' y='105' width='20' height='20' fill='#f5e5b8'/><rect x='160' y='105' width='20' height='20' fill='#f5e5b8'/><rect x='130' y='145' width='20' height='20' fill='#f5e5b8'/><rect x='160' y='145' width='20' height='20' fill='#f5e5b8'/><circle cx='265' cy='40' r='25' fill='#e2bd69'/>"],["El emblema","<path d='M70 30H250V130Q240 190 160 225Q80 190 70 130Z' fill='#71958b' stroke='#c8a76c' stroke-width='7'/><circle cx='160' cy='100' r='38' fill='#f1e3bd'/> <path d='M160 70L168 91L191 92L173 108L178 130L160 117L142 130L147 108L129 92L152 91Z' fill='#bd8c4c'/><path d='M105 155H215' stroke='#f1e3bd' stroke-width='8'/>"]];let g=0,n=0,round=0;const a=document.querySelector('#app');function picture(){return '<svg viewBox="0 0 320 240" role="img" aria-label="Dibujo secreto: '+data[n][0]+'">'+data[n][1]+'</svg>'}function home(){a.innerHTML='<div class="panel"><h2>Preparad papel y lápices de colores</h2><p>Un detective describe y otro dibuja sin mirar la pantalla. Después intercambiáis los papeles.</p><button onclick="menu(0)">Exploradores · 3.º y 4.º</button><button onclick="menu(1)">Expertos · 5.º y 6.º</button></div>'}function menu(j){g=j;round=0;a.innerHTML='<div class="panel"><button onclick="home()">← Niveles</button><h2>Elegid un sobre secreto</h2><div class="grid">'+data.slice(g*6,g*6+6).map((x,k)=>'<button onclick="start('+ (g*6+k)+')">✉️ Sobre '+(k+1)+'</button>').join('')+'</div></div>'}function start(j){n=j;a.innerHTML='<div class="panel"><button onclick="menu(g)">← Sobres</button><h2>Detective emisor '+(round+1)+'</h2><p>El receptor debe apartar la mirada de la pantalla. El emisor describe el dibujo sin señalarlo ni enseñarlo.</p><button class="primary" onclick="reveal()">Abrir sobre secreto</button></div>'}function reveal(){a.innerHTML='<div class="panel"><h2>Mensaje secreto</h2>'+picture()+'<p class="note">Describe formas, colores, tamaños y posiciones. El receptor puede preguntar y reformular para confirmar lo que ha entendido.</p><button onclick="hide()">Ocultar dibujo</button><button class="primary" onclick="compare()">Hemos terminado · Comparar</button></div>'}function hide(){a.innerHTML='<div class="panel"><h2>Mensaje oculto</h2><p>Seguid hablando sin mostrar el original.</p><button onclick="reveal()">Mostrar solo al emisor</button><button class="primary" onclick="compare()">Comparar dibujos</button></div>'}function compare(){a.innerHTML='<div class="panel"><h2>¡Comprobad el mensaje!</h2>'+picture()+'<p>Comparad con vuestro dibujo. No importa que sea perfecto.</p>'+['Hemos descrito las pistas con claridad.','Hemos escuchado sin interrumpir.','Hemos preguntado cuando algo no estaba claro.','Hemos comprobado si entendíamos el mensaje.'].map(x=>'<label><input type="checkbox"> '+x+'</label>').join('')+'<p>¿Qué podríamos mejorar la próxima vez?</p>'+(round===0?'<button class="primary" onclick="swap()">Intercambiar roles y abrir otro sobre</button>':'<button class="primary" onclick="menu(g)">Elegir otra misión</button>')+'</div>'}function swap(){round=1;start(g*6+(n%6+1)%6)}home()</script></html>
