<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Perfil de Detective Social</title><style>*{box-sizing:border-box}body{margin:0;background:#eee5d4;color:#443651;font:17px system-ui}main{max-width:1040px;margin:auto;padding:20px}header{text-align:center}h1{font:700 42px Georgia;color:#633e7d;margin:10px}h2,h3{font-family:Georgia}.panel{background:#fff9ed;border:3px solid #b79b65;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 5px 0 #d9c8a9}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #a38c73;background:#f5e8d4;color:#443651;cursor:pointer}button.primary{background:#65477f;color:white}button:focus-visible,select:focus-visible{outline:3px solid #d5a4e2}.muted{color:#6e6472;font-size:14px}.question{background:#f0e7f3;border-radius:12px;padding:14px;margin:12px 0}.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.options button{flex:1;min-width:125px}.options button[aria-pressed=true]{background:#b7d9cb;border:2px solid #4d786b;font-weight:bold}.progress{height:12px;border-radius:9px;background:#dfd4c3;overflow:hidden}.progress div{height:100%;background:#9574ad}.chart{width:100%;max-width:570px;display:block;margin:auto}.skill{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #e5d7c2}.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}footer{text-align:center;font-size:12px;margin:20px}@media(max-width:650px){.two{grid-template-columns:1fr}h1{font-size:30px}}@media print{button,select,.noprint{display:none!important}.panel{box-shadow:none}body{background:white}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · TAQUILLA DEL DETECTIVE</small><h1>🧭 Mi Perfil de Detective Social</h1><p>Descubre tus fortalezas y celebra cómo vas creciendo.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const skills=["Gestión emocional","Empatía","Escucha activa","Asertividad","Cooperación","Resolución de conflictos"],qs=[["Reconozco lo que siento y puedo ponerle nombre.","Cuando me altero, conozco alguna manera de calmarme.","Puedo explicar cómo me siento sin hacer daño."],["Intento comprender cómo se sienten otras personas.","Sé que dos personas pueden vivir una situación de forma distinta.","Pregunto antes de suponer lo que necesita alguien."],["Dejo que los demás terminen de hablar.","Hago preguntas cuando algo no me queda claro.","Compruebo que he entendido lo que me cuentan."],["Expreso mis opiniones de forma respetuosa.","Soy capaz de decir que no o poner límites.","Pido lo que necesito sin atacar a nadie."],["Cumplo mi parte cuando trabajo en equipo.","Tengo en cuenta las ideas de mis compañeros.","Ayudo a que todas las personas puedan participar."],["Antes de reaccionar, intento pensar qué ha sucedido.","Busco más de una solución ante un problema.","Puedo negociar un acuerdo o pedir ayuda."]],flat=qs.flat(),colors=['#7caa9c','#b19bc9','#86a8ce','#d49b89','#9daf7a','#dfb96e'],a=document.querySelector('#app');let studentName='',group='3A',all={},profile=0,phase='inicio',answers=Array(18).fill(null),step=0,storage=true;try{all=JSON.parse(localStorage.getItem('perfil-detective-v1')||'{}')||{}}catch(e){storage=false}function save(){try{localStorage.setItem('perfil-detective-v1',JSON.stringify(all))}catch(e){storage=false}}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rec(){return all[group+'-'+profile]||{}}function home(){let r=rec();a.innerHTML='<div class="panel"><h2>Tu aventura, a tu ritmo</h2><p>Lee cada frase y piensa en lo que haces habitualmente. No hay respuestas buenas ni malas. Si no sabes qué contestar, puedes pedir ayuda para comprender la frase.</p><div class="row"><label for="student">Nombre de pila:</label><input id="student" type="text" maxlength="60" autocomplete="off" placeholder="Escribe tu nombre" value="'+escapeHtml(studentName)+'" oninput="studentName=this.value"><label for="g">Clase-grupo:</label><select id="g" onchange="group=this.value;home()">'+['3A','3B','4A','4B','5A','5B','6A','6B'].map(x=>'<option value="'+x+'" '+(group===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label for="p">Mi taquilla:</label><select id="p" onchange="profile=Number(this.value);home()">'+Array.from({length:30},(_,i)=>'<option value="'+i+'" '+(profile===i?'selected':'')+'>Detective '+(i+1)+'</option>').join('')+'</select></div><p class="muted">Escribe solo tu nombre de pila, sin apellidos. El docente debe controlar el acceso a los registros. Las respuestas se envían a Google Sheets únicamente al finalizar y recibir confirmación. El perfil visual se conserva también en este navegador. No introduzcas apellidos ni otros datos personales.</p><div class="two"><div class="panel"><h3>🌱 Así comienza mi aventura</h3><p>Mi primera fotografía de habilidades.</p><button class="primary" onclick="start(\'inicio\')">'+(r.inicio?'Revisar respuestas':'Comenzar')+'</button></div><div class="panel"><h3>🌟 Así he crecido como detective</h3><p>Mi fotografía al terminar el programa.</p><button class="primary" onclick="start(\'final\')">'+(r.final?'Revisar respuestas':'Comenzar')+'</button></div></div><button onclick="results()">Ver mi perfil y evolución</button></div>'}function start(p){studentName=(document.querySelector('#student')?.value||studentName).trim();if(!/^[\p{L}][\p{L}\p{M} .'-]{0,59}$/u.test(studentName)){alert('Escribe tu nombre de pila antes de comenzar.');return}phase=p;answers=(rec()[p]||Array(18).fill(null)).slice();step=0;question()}function question(){let start=step*3;a.innerHTML='<div class="panel"><button onclick="home()">← Volver</button><h2>'+(phase==='inicio'?'🌱 Así comienza mi aventura':'🌟 Así he crecido como detective')+'</h2><p><b>'+skills[step]+'</b> · Bloque '+(step+1)+' de 6</p><div class="progress"><div style="width:'+((step+1)/6*100)+'%"></div></div>'+flat.slice(start,start+3).map((q,i)=>'<div class="question"><b>'+(start+i+1)+'. '+q+'</b><div class="options">'+['Todavía no','A veces','Muchas veces','Casi siempre'].map((o,j)=>'<button aria-pressed="'+(answers[start+i]===j)+'" onclick="choose('+(start+i)+','+j+')">'+o+'</button>').join('')+'</div></div>').join('')+'<div class="row"><button onclick="previous()">Anterior</button><button class="primary" onclick="next()">'+(step===5?'Terminar mi perfil':'Siguiente →')+'</button></div><p class="muted" id="message" role="status">Responde pensando en tus experiencias reales.</p></div>'}function choose(i,v){answers[i]=v;question()}function previous(){if(step>0){step--;question()}else home()}function next(){if(answers.slice(step*3,step*3+3).some(x=>x===null)){document.querySelector('#message').textContent='Responde las tres afirmaciones para continuar.';return}if(step<5){step++;question();return}submitProfile()}function submitProfile(){let payload={nombre:studentName,grupo:group,codigo:profile+1,momento:phase,respuestas:answers.map(x=>x+1)};a.innerHTML='<div class="panel"><h2>Enviando evaluación…</h2><p id="message" role="status">Espera la confirmación antes de cerrar esta página.</p></div>';if(typeof google==='undefined'||!google.script||!google.script.run){a.innerHTML='<div class="panel"><h2>Modo demostración</h2><p>Las respuestas están completas, pero todavía no se han enviado a Google Sheets. Para registrar evaluaciones utiliza la versión desplegada desde Apps Script.</p><button onclick="question()">Volver a mis respuestas</button></div>';return}google.script.run.withSuccessHandler(function(res){if(!res||!res.ok){failure('El servidor no confirmó el registro.');return}if(!all[group+'-'+profile])all[group+'-'+profile]={};all[group+'-'+profile][phase]=answers.slice();save();results();a.insertAdjacentHTML('afterbegin','<div class="panel" role="status"><b>✅ Evaluación registrada en Google Sheets.</b></div>')}).withFailureHandler(function(err){failure(err&&err.message?err.message:'No se pudo conectar con el registro.')}).registrarPerfil(payload)}function failure(msg){a.innerHTML='<div class="panel"><h2>⚠️ No se ha confirmado el registro</h2><p>'+String(msg).replace(/[<>&]/g,'')+'</p><p>Las respuestas siguen disponibles en esta sesión. Puedes volver a intentarlo.</p><button class="primary" onclick="submitProfile()">Reintentar envío</button><button onclick="question()">Revisar respuestas</button></div>'}function scores(x){return skills.map((_,i)=>Math.round(x.slice(i*3,i*3+3).reduce((a,b)=>a+b+1,0)/3*100)/100)}function svg(initial,final){let cx=290,cy=265,R=175;const pt=(i,r)=>{let ang=-Math.PI/2+i*Math.PI/3;return [cx+Math.cos(ang)*r,cy+Math.sin(ang)*r]},poly=(v)=>v.map((n,i)=>pt(i,n/4*R).join(',')).join(' ');let s='<svg class="chart" viewBox="0 0 580 560" role="img" aria-label="Gráfico radial de seis habilidades sociales">';for(let j=1;j<=4;j++)s+='<polygon points="'+skills.map((_,i)=>pt(i,j/4*R).join(',')).join(' ')+'" fill="none" stroke="#c9bcae" stroke-width="1.5"/>';skills.forEach((x,i)=>{let p=pt(i,R),t=pt(i,R+40);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#c9bcae"/><text x="'+t[0]+'" y="'+t[1]+'" font-size="13" text-anchor="middle" fill="#45374f">'+x.replace('Resolución de conflictos','Resolución')+'</text>'});if(initial)s+='<polygon points="'+poly(initial)+'" fill="#a68bc4" fill-opacity=".25" stroke="#8d6aa7" stroke-width="3"/>';if(final)s+='<polygon points="'+poly(final)+'" fill="#74b3a2" fill-opacity=".25" stroke="#397f70" stroke-width="3"/>';return s+'</svg>'}function results(){let r=rec(),i=r.inicio?scores(r.inicio):null,f=r.final?scores(r.final):null;if(!i&&!f){a.innerHTML='<div class="panel"><p>Aún no hay un perfil guardado.</p><button onclick="home()">Volver</button></div>';return}let latest=f||i;let low=latest.indexOf(Math.min(...latest));a.innerHTML='<div class="panel"><h2>Mi mapa de fortalezas</h2>'+svg(i,f)+'<div class="legend">'+(i?'<span><span class="dot" style="background:#8d6aa7"></span>Inicio</span>':'')+(f?'<span><span class="dot" style="background:#397f70"></span>Final</span>':'')+'</div><p class="muted">Escala orientativa: 1 = todavía no; 2 = a veces; 3 = muchas veces; 4 = casi siempre. Son percepciones personales, no notas ni diagnósticos.</p>'+skills.map((x,k)=>'<div class="skill"><span>'+x+'</span><span>'+(i?i[k].toFixed(1)+' al inicio':'')+(i&&f?' → ':'')+(f?f[k].toFixed(1)+' al final':'')+'</span></div>').join('')+'<h3>✨ Mi próximo pequeño reto</h3><p>Podría seguir practicando <b>'+skills[low].toLowerCase()+'</b>. Elige una acción sencilla y coméntala con tu docente.</p>'+(i&&f?'<p>Compara las dos figuras: ¿qué cambios reconoces? ¿Qué habilidades quieres seguir entrenando? Los resultados pueden cambiar según cómo te sientas o cómo interpretes las preguntas.</p>':'<p>Cuando completes el otro momento, podrás comparar ambos perfiles.</p>')+'<div class="row noprint"><button class="primary" onclick="home()">Volver a mi taquilla</button><button onclick="window.print()">Imprimir mi perfil</button><button onclick="download()">Descargar resultados (.txt)</button><button onclick="reset()">Borrar este perfil</button></div></div>'}function download(){let r=rec(),lines=['MI PERFIL DE DETECTIVE SOCIAL','Nombre '+studentName,'Grupo '+group,'Detective '+(profile+1),'Autoevaluación orientativa, no diagnóstica',''];['inicio','final'].forEach(p=>{if(!r[p])return;lines.push(p==='inicio'?'AL COMENZAR':'AL FINALIZAR');r[p].forEach((v,k)=>lines.push(flat[k]+' '+['Todavía no','A veces','Muchas veces','Casi siempre'][v]));lines.push('')});let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='perfil-detective-'+(profile+1)+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function reset(){if(confirm('¿Borrar las dos autoevaluaciones de este navegador? Los registros enviados a Google Sheets NO se borrarán.')){delete all[group+'-'+profile];save();home()}}home()</script></html>
