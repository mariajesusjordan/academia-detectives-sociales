<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar de la Comunicación</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e2ed;color:#38334c;font:18px system-ui}main{max-width:1000px;margin:auto;padding:20px}header,footer{text-align:center}h1{font: bold 42px Georgia;color:#55477c;margin:10px}h2{font-family:Georgia}.panel{background:#faf7ff;border:2px solid #b2a6c9;border-radius:24px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;cursor:pointer;border:2px solid #b2a6c9;background:#fff;border-radius:14px;padding:14px;color:#38334c;margin:4px}button:hover{background:#e8def5}button:focus-visible{outline:3px solid #55477c}.primary{background:#55477c;color:white}.animal{font-size:54px;display:block}.radar{width:140px;height:140px;border-radius:50%;margin:12px auto;background:repeating-radial-gradient(circle,#477b77 0 2px,transparent 3px 23px),conic-gradient(from 0deg,#a8d7bc,#244d56 25%,#244d56);border:6px solid #739b95;position:relative;overflow:hidden}.radar:after{content:'';position:absolute;left:50%;top:50%;width:50%;height:2px;background:#fff;transform-origin:left;animation:scan 4s linear infinite}@keyframes scan{to{transform:rotate(360deg)}}.signal{padding:20px;background:#e4eee7;border-radius:14px;font-size:22px}.answers{display:grid;gap:8px}.answers button{text-align:left}.feedback{padding:12px;background:#f5e7c8;border-radius:12px;margin:12px 0}footer{font-size:12px;margin:20px}small{letter-spacing:2px}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · ASERTIVIDAD</small><h1>El Radar de la Comunicación</h1><p>Detecta el estilo y aprende a expresar lo que necesitas.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["Te quitan un lápiz.","Da igual, quédate con él.","¡Devuélvemelo, idiota!","Lo necesito. Por favor, devuélvemelo."],["No quieres jugar a un juego.","Vale, jugaré aunque no quiera.","¡Vaya juego más tonto!","Prefiero otro juego. ¿Buscamos una alternativa?"],["Te interrumpen.","Mejor no digo nada.","¡Cállate ya!","Déjame terminar, por favor."],["Necesitas ayuda.","No preguntaré aunque no entienda.","¡Explícamelo ahora mismo!","¿Puedes ayudarme a entenderlo?"],["Alguien se cuela.","No diré nada.","¡Fuera de aquí!","Estaba esperando. Respeta mi turno, por favor."],["No te prestan un juguete.","Nunca más pediré nada.","¡Eres un egoísta!","Entiendo. ¿Me lo prestarías después?"],["Un amigo insiste en copiar tu tarea.","Bueno, copia.","¡Eres un aprovechado!","No quiero que copies, pero puedo ayudarte."],["No cuentan contigo en el grupo.","Mejor hago lo que digan.","¡Todos sois unos inútiles!","Me gustaría que escucharais mi propuesta."],["Te ponen un apodo molesto.","Me reiré aunque me duela.","¡Te voy a insultar yo también!","No me gusta ese apodo. Te pido que pares."],["No estás de acuerdo con una decisión.","Me callo para evitar problemas.","¡Mi idea es la única buena!","Tengo otra opinión. ¿Puedo explicarla?"],["Te presionan para hacer algo que no quieres.","Lo haré para que no se enfaden.","¡Dejadme en paz, sois horribles!","No quiero hacerlo. Respetad mi decisión."],["Un compañero critica tu trabajo.","Seguro que todo lo hago mal.","¡Tu trabajo es mucho peor!","¿Puedes decirme qué mejorar de forma respetuosa?"]],a=document.querySelector('#app'),names=['Pasivo','Agresivo','Asertivo'],animals=['🐢','🦁','🦉'],desc=['No expresa sus necesidades o derechos.','Expresa sus necesidades sin respetar a los demás.','Expresa sus necesidades respetando también a los demás.'];let g=0,n=0,style=0,score=0,tries=0;function home(){a.innerHTML='<div class="panel"><h2>Tres estilos de comunicación</h2><div class="grid">'+names.map((x,i)=>'<div><span class="animal">'+animals[i]+'</span><strong>'+x+'</strong><p>'+desc[i]+'</p></div>').join('')+'</div><p>Los animales representan estilos, no personas. Todos podemos aprender a comunicarnos de forma asertiva.</p><button onclick="start(0)">Exploradores · 3.º y 4.º</button><button onclick="start(1)">Expertos · 5.º y 6.º</button></div>'}function start(j){g=j;n=0;score=0;show()}function show(){tries=0;style=Math.floor(Math.random()*3);let c=data[g*6+n];a.innerHTML='<div class="panel"><button onclick="home()">← Inicio</button><span> Señal '+(n+1)+' de 6</span><div class="radar" aria-hidden="true"></div><h2>'+c[0]+'</h2><div class="signal">«'+c[style+1]+'»</div><h3>¿Qué estilo detectas?</h3><div class="grid" id="choices">'+names.map((x,i)=>'<button onclick="detect('+i+')"><span class="animal">'+animals[i]+'</span>'+x+'</button>').join('')+'</div><div id="feedback" role="status"></div></div>'}function detect(i){tries++;let f=document.querySelector('#feedback');f.className='feedback';if(i!==style){f.textContent='Piensa: ¿expresa lo que necesita? ¿Respeta a la otra persona? Inténtalo de nuevo.';return}if(tries===1)score++;document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);f.innerHTML='<b>¡Señal identificada!</b> '+desc[i]+' <button class="primary" onclick="practice()">Entrena la asertividad →</button>'}function practice(){let c=data[g*6+n],order=[0,1,2].sort((x,y)=>(x+n)%3-(y+n)%3);a.innerHTML='<div class="panel"><h2>'+c[0]+'</h2><p>¿Qué respuesta expresa tus necesidades respetando a los demás?</p><div class="answers">'+order.map(i=>'<button onclick="choose('+i+')">'+c[i+1]+'</button>').join('')+'</div><div id="feedback" role="status"></div></div>'}function choose(i){let f=document.querySelector('#feedback');f.className='feedback';if(i!==2){f.textContent='Busca una respuesta que defienda tus necesidades sin atacar ni renunciar a ellas.';return}document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);f.innerHTML='<b>¡Respuesta asertiva!</b> Puedes expresar tus necesidades y poner límites con respeto. <button class="primary" onclick="next()">Continuar →</button>'}function next(){n++;if(n<6){show();return}a.innerHTML='<div class="panel"><h2>🏅 Investigación completada</h2><p>Estilos identificados a la primera: '+score+' de 6.</p><p>Practica con tu pareja: inventad una respuesta asertiva para una situación cotidiana.</p><button onclick="start(g)">Repetir</button><button onclick="home()">Cambiar nivel</button></div>'}home()</script></html>
