<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Radio del Detective</title><style>*{box-sizing:border-box}body{margin:0;background:#e5ded0;color:#253e3b;font:17px system-ui}main{max-width:1050px;margin:auto;padding:16px}header{text-align:center}h1,h2,h3{font-family:Georgia}h1{font-size:40px;margin:8px}small{letter-spacing:2px}button{font:inherit;cursor:pointer;border:1px solid #987b5d;border-radius:12px;padding:11px 16px;background:#fff5df;color:#253e3b}button:hover{background:#ead7b5}button:focus-visible{outline:3px solid #c17a42}button.primary{background:#235c59;color:white}.panel{background:#fbf4e5;border:2px solid #b29a7c;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.radio{background:#986747;border:8px double #60452f;border-radius:28px;padding:20px;max-width:780px;margin:auto;color:#fff3dc;box-shadow:0 7px 0 #614631}.screen{background:#183b3a;border:5px solid #cab18b;border-radius:16px;text-align:center;padding:20px}.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:60px}.wave i{width:7px;background:#b9e1c6;border-radius:5px;height:var(--h)}.playing .wave i{animation:pulse .65s infinite alternate;animation-delay:var(--d)}@keyframes pulse{to{transform:scaleY(.35)}}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.dial{height:12px;background:repeating-linear-gradient(90deg,#d7b889 0 2px,transparent 2px 20px);margin:12px}.answers{display:grid;gap:8px}.answers button{text-align:left}.feedback{background:#e0ebdc;padding:12px;border-radius:12px;margin-top:10px}footer{text-align:center;font-size:12px;margin:20px}details{margin:14px 0} @media(max-width:650px){.grid{grid-template-columns:1fr 1fr}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · ESCUCHA ACTIVA</small><h1>La Radio del Detective</h1><p>Sintoniza, escucha y comprende.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["El estuche","Soy Alba. He perdido mi estuche azul durante el recreo. Estoy preocupada porque dentro está mi lápiz favorito. ¿Puedes ayudarme a buscarlo?","¿Qué ha perdido Alba?","Su estuche azul","Su mochila","Su cuaderno","¿Cómo puedes responder?","Te ayudo a buscarlo. ¿Dónde lo viste por última vez?","Compra otro.","No importa."],["El partido","Soy Hugo. Hoy perdimos el partido y estoy triste. Me gustaría que alguien me escuchara antes de volver a jugar.","¿Qué necesita Hugo?","Que alguien lo escuche","Otro balón","Ganar inmediatamente","¿Qué le dirías?","¿Quieres contarme cómo te has sentido?","Deja de estar triste.","Era fácil ganar."],["La biblioteca","Soy Nora. Necesito devolver dos libros mañana. Los he dejado en una bolsa verde junto a la puerta.","¿Dónde están los libros?","En una bolsa verde","En el patio","En su mesa","¿Cómo compruebas que has entendido?","Entonces, están en la bolsa verde junto a la puerta, ¿verdad?","Sí, sí, lo que sea.","Seguro que están en clase."],["El dibujo","Soy Leo. Mi dibujo se ha roto sin querer. Me da pena porque era para mi abuela. Quiero intentar arreglarlo.","¿Para quién era el dibujo?","Para su abuela","Para su profesor","Para su amigo","¿Qué respuesta ayuda?","Entiendo que te dé pena. ¿Quieres que te ayude?","Haz otro y ya está.","No era bonito."],["El juego","Soy Sara. Quiero aprender vuestro juego, pero no entiendo las reglas. ¿Podéis explicármelas despacio?","¿Qué pide Sara?","Una explicación de las reglas","Cambiar de juego","Jugar sola","¿Cómo respondes?","Claro, te explicamos las reglas y puedes preguntar.","Mira y aprende.","No puedes jugar."],["La excursión","Soy Dani. Mañana debemos traer agua, un bocadillo y una gorra. Me preocupa olvidarme de algo.","¿Qué tres cosas necesita?","Agua, bocadillo y gorra","Agua, libros y gorra","Fruta, lápiz y abrigo","¿Cómo le ayudas?","Repasemos juntos las tres cosas.","No te preocupes por nada.","Trae cualquier cosa."],["El grupo","Soy Eva. Tengo ideas para el trabajo, pero cuando intento hablar alguien me interrumpe. Me gustaría terminar de explicar mi propuesta.","¿Qué necesita Eva?","Que respeten su turno","Hacer todo el trabajo sola","Cambiar de asignatura","¿Qué respuesta demuestra escucha?","Perdona, termina tu propuesta. Después hablamos.","Ya conocemos tu idea.","Habla más rápido."],["El mensaje breve","Soy Samuel. Ayer respondí solo con un vale porque estaba cuidando a mi hermano. No estaba enfadado, aunque mi amiga lo interpretó así.","¿Por qué respondió brevemente?","Estaba cuidando a su hermano","Estaba enfadado","Quería romper la amistad","¿Cómo evitar el malentendido?","Preguntar qué quería decir antes de sacar conclusiones.","Ignorar su explicación.","Decidir que está mintiendo."],["La exposición","Soy Ana. Sé que mi compañero quería corregir un dato, pero me sentí avergonzada cuando lo hizo delante de todos. Prefiero que me avise en privado.","¿Qué prefiere Ana?","Que le avisen en privado","Que nunca la corrijan","No volver a exponer","¿Qué refleja su mensaje?","Entiendo que te molestó la forma de corregirte.","No tienes motivos para sentirte así.","Lo importante es que tenía razón."],["El cambio de planes","Soy Marta. Habíamos quedado para hacer el trabajo a las cinco, pero tengo una cita familiar. Puedo a las seis o mañana. Quiero buscar una solución.","¿Qué alternativas propone?","A las seis o mañana","A las cuatro","Cancelar el trabajo","¿Cómo responderías?","Veamos cuál de las dos opciones nos viene bien.","Siempre cambias los planes.","Pues hazlo sola."],["La broma","Soy Omar. Mis compañeros me llaman por un apodo que no me gusta. Ya les he pedido que paren, pero siguen. Necesito que me tomen en serio.","¿Qué ha pedido Omar?","Que dejen de usar el apodo","Que inventen otro apodo","Que todos se rían","¿Qué respuesta es adecuada?","Te escucho. Deben respetar tu límite; podemos pedir ayuda a un adulto.","Solo es una broma.","Ignóralos siempre."],["Una conversación difícil","Soy Inés. Quiero contarte algo, pero todavía no sé cómo explicarlo. No necesito consejos ahora mismo. Solo quiero que me escuches un rato.","¿Qué necesita Inés ahora?","Que la escuchen sin darle consejos","Una solución inmediata","Que cambien de tema","¿Qué le dirías?","Estoy aquí. Tómate tu tiempo.","Yo sé lo que tienes que hacer.","Cuéntamelo rápido."]];let g=0,n=0,q=0,utter=null,token=0;const a=document.querySelector('#app');function stop(){token++;if('speechSynthesis'in window)speechSynthesis.cancel();utter=null;let r=document.querySelector('.radio');if(r)r.classList.remove('playing')}function home(){stop();a.innerHTML='<div class="panel"><h2>Elige tu nivel</h2><div class="controls"><button onclick="menu(0)">Detectives Exploradores · 3.º y 4.º</button><button onclick="menu(1)">Detectives Expertos · 5.º y 6.º</button></div></div>'}function menu(j){stop();g=j;a.innerHTML='<div class="panel"><button onclick="home()">← Cambiar nivel</button><h2>Elige una transmisión</h2><div class="grid">'+data.slice(g*6,g*6+6).map((c,k)=>'<button onclick="start('+ (g*6+k)+')">📻 Canal '+(k+1)+'<h3>'+c[0]+'</h3></button>').join('')+'</div></div>'}function start(j){stop();n=j;q=0;a.innerHTML='<div class="panel"><button onclick="menu(g)">← Canales</button><h2>'+data[n][0]+'</h2><div class="radio"><div class="screen"><small>CANAL '+(n%6+1)+' · TRANSMISIÓN</small><div class="wave">'+Array.from({length:23},(_,k)=>'<i style="--h:'+(12+Math.round(35*Math.abs(Math.sin(k*1.7))))+'px;--d:'+(k*.06)+'s"></i>').join('')+'</div><p id="status" role="status">Preparado para escuchar</p></div><div class="dial"></div><div class="controls"><button onclick="play()">▶ Escuchar / repetir</button><button onclick="stop();statusText(\'Transmisión detenida\')">■ Detener</button></div></div><details><summary>Consultar transcripción accesible</summary><p>'+data[n][1]+'</p></details><button class="primary" onclick="stop();question()">He escuchado el mensaje →</button><div id="quiz"></div></div>'}function statusText(s){let el=document.querySelector('#status');if(el)el.textContent=s}function play(){stop();if(!('speechSynthesis'in window)){statusText('Voz no disponible. Consulta la transcripción.');return}let t=token;utter=new SpeechSynthesisUtterance(data[n][1]);utter.lang='es-ES';utter.rate=.88;let voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));if(voices.length)utter.voice=voices[n%voices.length];utter.onstart=()=>{if(t!==token)return;document.querySelector('.radio')?.classList.add('playing');statusText('En antena…')};utter.onend=()=>{if(t!==token)return;document.querySelector('.radio')?.classList.remove('playing');statusText('Transmisión finalizada')};utter.onerror=()=>{if(t!==token)return;document.querySelector('.radio')?.classList.remove('playing');statusText('No se pudo reproducir. Prueba de nuevo o consulta el texto.')};speechSynthesis.speak(utter)}function question(){let c=data[n],k=q?6:2,order=[0,1,2].sort((x,y)=>(x+n+q)%3-(y+n+q)%3);document.querySelector('#quiz').innerHTML='<h3>Reto '+(q+1)+' de 2 · '+c[k]+'</h3><div class="answers">'+order.map(j=>'<button onclick="answer('+j+')">'+c[k+1+j]+'</button>').join('')+'</div><div id="feedback" role="status"></div>'}function answer(j){let f=document.querySelector('#feedback');f.className='feedback';if(j!==0){f.textContent='Vuelve a escuchar y fíjate en lo que la persona dice o necesita. Puedes intentarlo de nuevo.';return}document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);f.innerHTML=q?'¡Misión completada! Has elegido una respuesta que tiene en cuenta el mensaje y las necesidades de la otra persona.<div class="controls"><button onclick="menu(g)">Otros canales</button>'+(n%6<5?'<button class="primary" onclick="start(n+1)">Siguiente misión</button>':'')+'</div>':'¡Exacto! Has identificado la información clave de la transmisión. <button onclick="q=1;question()">Siguiente reto →</button>'}home();</script></body></html>
