<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semáforo de la Calma</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff8d9,#dceef5);font:18px system-ui;color:#28465a}main{max-width:1100px;margin:auto;padding:20px}header{text-align:center;background:#fff8e8;border:4px solid #f1c65b;border-radius:24px;padding:18px;box-shadow:0 6px #d6ae5355}h1{font-size:clamp(26px,5vw,48px);margin:8px}h2{margin-top:0}button,textarea{font:inherit}button{cursor:pointer;border:2px solid #ffffffaa;border-radius:15px;padding:12px 18px;background:#286e91;color:white;font-weight:700;box-shadow:0 4px #18496355}button:focus-visible{outline:4px solid #172c43}button:disabled{opacity:.5;cursor:default}button.choice{background:#fff;color:#294658;border:2px solid #b2c8d3;box-shadow:0 3px #b2c8d3}button.selected{background:#d4edf9;border-color:#286e91}.layout{display:grid;grid-template-columns:140px 1fr;gap:18px;margin-top:18px}.panel{background:#fffdf5;border:3px solid white;border-radius:25px;padding:22px;box-shadow:0 5px 15px #28465a22}.lights{background:#304657;border-radius:28px;padding:16px;align-self:start;display:grid;gap:12px;box-shadow:0 6px #172c43}.light{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:bold;opacity:.35;border:5px solid #ffffff55;color:#172c43}.light.active{opacity:1;box-shadow:0 0 18px currentColor}.red{background:#ff7775}.yellow{background:#ffda56}.green{background:#80da8d}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.orb{height:100px;width:100px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff6d9,#ef9395);margin:32px auto;display:grid;place-items:center;font-size:32px;transition:transform 4s ease-in-out}.center{text-align:center}.note{background:#eaf4f8;border-radius:14px;padding:12px}.scenario{background:#fff0c0;border:2px solid #e6bf58;padding:15px;border-radius:15px;margin:12px 0}textarea{width:100%;border:2px solid #aac2ce;border-radius:12px;padding:10px;resize:vertical}footer{text-align:center;font-size:12px;margin:20px}button.home{background:#607582}.brick{display:inline-block;font-size:14px;background:#e7bb55;padding:6px 12px;border-radius:8px;font-weight:bold;letter-spacing:1px}@media(max-width:620px){.layout{grid-template-columns:1fr}.lights{display:flex;justify-content:center}.light{width:58px}.panel{padding:16px}}@media(prefers-reduced-motion:reduce){.orb{transition:none}}
</style></head><body><main><header><span class="brick">🕵️ ACADEMIA DE DETECTIVES SOCIALES</span><h1>🚦 Semáforo de la Calma</h1><p>Me detengo, pienso y actúo con respeto.</p></header><div class="layout"><aside class="lights" aria-label="Fases del semáforo"><div class="light red" id="l1">1</div><div class="light yellow" id="l2">2</div><div class="light green" id="l3">3</div></aside><section class="panel" id="view"></section></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados. No se guardan respuestas ni datos personales.</footer></main><script>
const $=id=>document.getElementById(id);let mode='',step=0,scene=0,emotion='',thought='',solution='',timer=null;const cases=[['El turno del juego','Estás jugando y alguien se cuela delante de ti.'],['El material perdido','Un compañero usa tu lápiz sin pedir permiso.'],['El equipo','En un juego no están escuchando tus ideas.'],['Un malentendido','Alguien se ríe cerca de ti y piensas que se ríe de ti.'],['El recreo','Dos compañeros quieren jugar a cosas diferentes.'],['El trabajo en grupo','Un compañero cambia vuestro trabajo sin consultarte.']];const emotions=['😠 Enfado','😢 Tristeza','😟 Preocupación','😣 Frustración','😳 Vergüenza','😕 Confusión','😌 Calma','Otra emoción'];const thoughts=['Puedo escuchar su explicación','Puedo expresar lo que necesito','Podemos buscar un acuerdo','Necesito distancia o ayuda'];const solutions=['Hablar con calma y escuchar','Pedir un turno o llegar a un acuerdo','Pedir ayuda a una persona adulta','Disculparme si he hecho daño','Alejarme un momento de forma segura'];function stop(){clearInterval(timer);timer=null}function go(n){stop();step=n;render()}function start(m){mode=m;scene=0;emotion=thought=solution='';go(1)}function choose(key,i){if(key==='emotion')emotion=emotions[i];if(key==='thought')thought=thoughts[i];if(key==='solution')solution=solutions[i];render()}function buttons(arr,key,val){return '<div class="choices">'+arr.map((a,i)=>'<button class="choice '+(val===a?'selected':'')+'" aria-pressed="'+(val===a)+'" onclick="choose(\''+key+'\','+i+')">'+a+'</button>').join('')+'</div>'}function nav(next,label){return '<div class="nav"><button class="home" onclick="go(0)">⌂ Inicio</button>'+(step>1?'<button class="home" onclick="go('+(step-1)+')">← Atrás</button>':'')+'<button onclick="go('+next+')">'+label+' →</button></div>'}function render(){stop();for(let i=1;i<=3;i++)$('l'+i).classList.toggle('active',step===i);let v=$('view'),s=mode==='practice'?'<div class="scenario"><b>🔎 Caso '+(scene+1)+': '+cases[scene][0]+'</b><p>'+cases[scene][1]+'</p></div>':'';if(step===0){v.innerHTML='<h2>¡Hola, detective!</h2><p>Elige cómo quieres utilizar tu semáforo.</p><div class="choices"><button onclick="start(\'practice\')">🔍 Modo entrenamiento</button><button onclick="start(\'real\')">💚 Necesito calmarme</button></div><p class="note">No tienes que resolver un conflicto mientras estás muy alterado. Puedes pedir ayuda o tomarte más tiempo.</p>';return}if(step===1){v.innerHTML='<h2>🔴 1. ME DETENGO</h2>'+s+'<p>¿Qué emoción notas ahora?</p>'+buttons(emotions,'emotion',emotion)+'<div class="center"><div class="orb" id="orb">🍃</div><b id="instruction">Respira a tu ritmo</b><p id="count">Puedes seguir el círculo o simplemente descansar.</p><button id="breathe" onclick="breath()">Iniciar respiración</button></div>'+nav(2,'Estoy preparado para pensar');return}if(step===2){v.innerHTML='<h2>🟡 2. PIENSO</h2>'+s+'<p>¿Qué ha ocurrido? ¿Qué siento? ¿Cómo podría sentirse la otra persona?</p><p class="note">No sabemos siempre lo que piensan los demás. Podemos preguntar sin acusar.</p><p>¿Qué posibilidad te ayudaría?</p>'+buttons(thoughts,'thought',thought)+nav(3,'Elegir una solución');return}if(step===3){v.innerHTML='<h2>🟢 3. ACTÚO</h2>'+s+'<p>Elige una acción segura y respetuosa.</p>'+buttons(solutions,'solution',solution)+'<p class="note">Puedes decir: «Me siento… cuando… y necesito…». Si alguien te amenaza o te hace daño, busca ayuda adulta; no tienes que resolverlo solo.</p>'+nav(4,'Terminar');return}v.innerHTML='<h2>⭐ ¡Buen trabajo, detective!</h2><p>Has practicado los tres pasos del semáforo.</p>'+(emotion?'<p>Emoción: <b>'+emotion+'</b></p>':'')+(thought?'<p>Alternativa: '+thought+'</p>':'')+(solution?'<p>Acción elegida: '+solution+'</p>':'')+'<p>¿Necesitas más tiempo? Puedes volver a respirar o pedir ayuda.</p><div class="nav"><button onclick="go(0)">⌂ Inicio</button><button onclick="go(1)">Volver a la calma</button>'+(mode==='practice'?'<button onclick="nextCase()">🔎 Siguiente caso</button>':'')+'</div>'}function nextCase(){scene=(scene+1)%cases.length;emotion=thought=solution='';go(1)}function breath(){if(timer){stop();$('orb').style.transform='scale(1)';$('breathe').textContent='Iniciar respiración';$('instruction').textContent='Respira a tu ritmo';return}let t=0;$('breathe').textContent='Detener';function tick(){if(t>=30){stop();$('orb').style.transform='scale(1)';$('instruction').textContent='¿Cómo te sientes ahora?';$('count').textContent='Puedes repetir o avanzar cuando estés preparado.';$('breathe').textContent='Repetir';return}let p=t%10;if(p===0||p===4){$('orb').style.transitionDuration=p===0?'4s':'6s';$('orb').style.transform=p===0?'scale(1.35)':'scale(1)'}$('instruction').textContent=p<4?'Inspira suavemente':'Suelta el aire despacio';$('count').textContent='Respiración '+(Math.floor(t/10)+1)+' de 3';t++}tick();timer=setInterval(tick,1000)}render();
</script></body></html>
