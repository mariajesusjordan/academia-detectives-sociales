<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Teatro de los Detectives</title><style>*{box-sizing:border-box}body{margin:0;background:#392a40;color:#fdf2de;font:18px system-ui}main{max-width:1050px;margin:auto;padding:20px}header,footer{text-align:center}h1{font:bold 42px Georgia;color:#f4d49b;margin:12px}h2,h3{font-family:Georgia}.stage{border:7px double #b89160;border-radius:24px;background:#602e45;padding:20px;box-shadow:inset 0 0 35px #301d30}.paper{background:#fff1d9;color:#4c3546;border-radius:14px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{background:#ecd8c3;color:#4c3546;border-radius:12px;padding:14px}.role:nth-child(2){background:#d6e4dc}.role:nth-child(3){background:#ded4ed}button{font:inherit;border:1px solid #ac8c67;border-radius:12px;padding:12px;background:#f8e7c5;color:#4c3546;margin:4px;cursor:pointer}button.primary{background:#eac27f;font-weight:bold}button:focus-visible{outline:3px solid white}#clock{font:bold 48px Georgia;text-align:center;font-variant-numeric:tabular-nums}.row{display:flex;flex-wrap:wrap;gap:8px}label{display:block;margin:12px 0}footer{font-size:12px;margin:20px}small{letter-spacing:2px}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:30px}}</style><main><header><small>ACADEMIA DE DETECTIVES SOCIALES · ASERTIVIDAD</small><h1>🎭 El Teatro de los Detectives</h1><p>Ensaya, escucha y expresa tus necesidades con respeto.</p></header><div id="app"></div><footer>Somos Detectives Sociales · © 2026 María Jesús Relaño. Todos los derechos reservados.</footer></main><script>const data=[["El lápiz prestado","Un compañero toma tu lápiz sin pedir permiso.","Pide que te devuelva el lápiz.","Explica que lo necesitabas y escucha su petición.","Pedir permiso y defender tus materiales."],["Otro juego","Tus amigos quieren jugar a algo que no te apetece.","Propón otra actividad.","Expresa que prefieres el juego inicial.","Expresar preferencias sin imponerlas."],["Mi turno","Alguien se adelanta en la fila.","Pide que respete tu turno.","Explica que tienes prisa.","Defender tu turno con respeto."],["Necesito ayuda","No comprendes una actividad.","Solicita ayuda concreta.","Escucha y ofrece una explicación.","Pedir ayuda."],["Mi dibujo","Un compañero hace una crítica sobre tu dibujo.","Expresa cómo te afecta.","Reformula tu comentario con respeto.","Recibir críticas y expresar emociones."],["No quiero prestar","Un compañero quiere tu material favorito.","Di que no de forma amable.","Acepta la negativa y busca otra opción.","Decir que no."],["Déjame terminar","Te interrumpen mientras cuentas algo.","Pide terminar tu explicación.","Espera y después comparte tu idea.","Respetar turnos."],["Jugamos todos","Una persona quiere incorporarse al juego.","Pide participar.","Explica las reglas y busca una forma de incluirla.","Solicitar inclusión."],["Un accidente","Un compañero derrama agua sobre tu trabajo.","Expresa tu malestar sin acusar.","Explica lo sucedido y ofrece ayuda.","Comunicar emociones y reparar."],["Demasiado ruido","El ruido no te deja trabajar.","Pide que bajen el volumen.","Expresa qué necesitas para realizar tu tarea.","Negociar necesidades."],["La presión del grupo","Un amigo insiste en que copies una tarea.","Rechaza la propuesta con firmeza.","Pide ayuda para entender la tarea sin insistir en copiar.","Resistir la presión."],["Una opinión diferente","El grupo no comparte tu propuesta.","Explica tus razones.","Expresa tu desacuerdo respetuosamente.","Argumentar sin atacar."],["Reparto injusto","El trabajo de equipo está desequilibrado.","Pide revisar el reparto.","Explica tus dificultades y negocia.","Negociar responsabilidades."],["Mi espacio","Alguien se acerca demasiado y te incomoda.","Pide espacio personal.","Escucha y respeta el límite.","Poner límites personales."],["La broma incómoda","Una broma ficticia ha molestado a un compañero. No representéis insultos.","Explica que no te ha gustado.","Reconoce el impacto y acuerda parar.","Poner límites ante bromas."],["El mensaje confuso","Un mensaje breve se ha interpretado como enfado.","Pregunta qué quería decir.","Aclara tu intención.","Evitar malentendidos."],["No compartas mi foto","Un amigo quiere compartir una foto tuya sin permiso.","Niega tu consentimiento.","Acepta la decisión sin presionar.","Defender la privacidad."],["El cambio de planes","Tu pareja de trabajo cambia la hora acordada.","Explica cómo te afecta.","Propón alternativas posibles.","Buscar acuerdos."],["Necesito que me escuches","Quieres hablar de algo que te preocupa.","Pide escucha sin consejos inmediatos.","Escucha y pregunta qué necesita.","Expresar necesidades emocionales."],["Pedir apoyo","Una persona no respeta repetidamente tus límites. Simulad únicamente la petición de ayuda.","Cuenta a un adulto ficticio qué sucede y pide apoyo.","Interpreta a un adulto que escucha y ayuda a proteger.","Buscar ayuda ante conflictos persistentes."]],a=document.querySelector('#app');let g=0,n=0,swap=false,t=null,left=120;function stop(){clearInterval(t);t=null}function home(){stop();a.innerHTML='<div class="stage"><h2>¡Se abre el telón!</h2><p>Formad grupos de tres: dos intérpretes y un detective observador. Podéis pasar una escena si os incomoda. Usad personajes ficticios y no reproduzcáis insultos ni agresiones.</p><button onclick="menu(0)">Exploradores · 3.º y 4.º</button><button onclick="menu(1)">Expertos · 5.º y 6.º</button></div>'}function menu(j){stop();g=j;a.innerHTML='<div class="stage"><button onclick="home()">← Niveles</button><h2>Elegid una escena</h2><button class="primary" onclick="openScene(g*10+Math.floor(Math.random()*10))">🎲 Escena sorpresa</button><div class="grid">'+data.slice(g*10,g*10+10).map((x,k)=>'<button onclick="openScene('+(g*10+k)+')">'+(k+1)+'. '+x[0]+'</button>').join('')+'</div></div>'}function openScene(j){n=j;swap=false;scene()}function scene(){stop();let c=data[n];left=120;a.innerHTML='<div class="stage"><button onclick="menu(g)">← Escenas</button><div class="paper"><h2>'+c[0]+'</h2><p>'+c[1]+'</p><b>Reto: '+c[4]+'</b></div><div class="grid"><div class="role"><h3>🎭 Intérprete '+(swap?'B':'A')+'</h3>'+c[2]+'</div><div class="role"><h3>🎭 Intérprete '+(swap?'A':'B')+'</h3>'+c[3]+'</div><div class="role"><h3>🔎 Observador</h3>Fíjate en el respeto, la claridad, la escucha y los límites.</div></div><p>Preparad la escena y representadla con vuestras propias palabras. Podéis usar: «Me siento… cuando… porque… Me gustaría…»</p><div id="clock">2:00</div><div class="row"><button id="play" onclick="toggle()">Iniciar ensayo</button><button onclick="reset()">Reiniciar tiempo</button><button class="primary" onclick="review()">Fin de la escena →</button></div><p id="status" role="status"></p></div>'}function tick(){document.querySelector('#clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function toggle(){if(t){stop();document.querySelector('#play').textContent='Continuar';return}if(!left)return;document.querySelector('#play').textContent='Pausar';t=setInterval(()=>{left--;tick();if(!left){stop();document.querySelector('#status').textContent='Tiempo orientativo terminado. Podéis continuar si lo necesitáis.'}},1000)}function reset(){stop();left=120;tick();document.querySelector('#play').textContent='Iniciar ensayo';document.querySelector('#status').textContent=''}function review(){stop();a.innerHTML='<div class="stage"><div class="paper"><h2>Crítica constructiva del detective</h2><p>Comentad juntos qué habéis observado, sin juzgar a nadie.</p>'+['Expresaron sus necesidades con claridad.','Respetaron los turnos y escucharon.','Defendieron los límites sin atacar.','Aceptaron las negativas o buscaron acuerdos cuando era posible.'].map(x=>'<label><input type="checkbox"> '+x+'</label>').join('')+'<p>¿Qué frase ha sido especialmente asertiva? ¿Qué podríais mejorar?</p></div><button onclick="swap=!swap;scene()">Intercambiar intérpretes y repetir</button><button class="primary" onclick="menu(g)">Nueva escena · Rotad los tres roles</button></div>'}home()</script></html>
